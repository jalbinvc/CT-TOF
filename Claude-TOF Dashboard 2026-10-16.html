<title>TOF Idea Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#151415;
  --bg-2:#1e1c1e;
  --bg-3:#26232a;
  --bg-inset:#161516;
  --fg:#EDECEB;
  --fg-mute:rgba(237,236,235,0.62);
  --fg-dim:rgba(237,236,235,0.4);
  --line:rgba(237,236,235,0.09);
  --line-2:rgba(237,236,235,0.14);
  --purple:#C8CCFF;
  --purple-soft:rgba(200,204,255,0.14);
  --purple-line:rgba(200,204,255,0.32);
  --orange:#FF5900;
  --orange-soft:rgba(255,89,0,0.12);
  --orange-line:rgba(255,89,0,0.42);
  --red:#AB1410;
  --red-soft:rgba(171,20,16,0.16);
  --red-text:#EF6B67;
  --green:#7CDBA8;
  --green-soft:rgba(124,219,168,0.14);
  --yellow:#F2C14E;
  --yellow-soft:rgba(242,193,78,0.14);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;padding:0;margin:0}
main{max-width:1280px;margin:0 auto;padding:32px 28px 96px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:32px}
.hd-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand .mark{width:34px;height:34px;background:var(--purple);color:var(--bg);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:15px}
.brand .lbl{display:flex;flex-direction:column;gap:2px}
.brand .lbl .t{font-weight:600;letter-spacing:-.2px;font-size:14px;color:var(--fg)}
.brand .lbl .s{color:var(--fg-mute);font-size:11.5px;letter-spacing:.2px}
.runmode{padding:4px 10px;border-radius:99px;background:var(--purple-soft);color:var(--purple);font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border:1px solid var(--purple-line)}
h1{font-size:26px;font-weight:600;letter-spacing:-.6px;margin:0 0 6px;text-wrap:balance}
h1 .date{color:var(--fg-mute);font-weight:500}
.subline{color:var(--fg-mute);font-size:13px;margin-bottom:22px}
.subline .sep{color:var(--fg-dim);padding:0 8px}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:28px}
.stat{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat .k{color:var(--fg-mute);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.1px}
.stat .v{font-family:var(--mono);font-size:22px;font-weight:600}
.stat.g .v{color:var(--green)}
.stat.y .v{color:var(--yellow)}
.stat.p .v{color:var(--purple)}
.stat.r .v{color:var(--red-text)}
.stat.o .v{color:var(--orange)}

/* ---------- rankings summary ---------- */
.rank-table{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:28px}
.rt-head{display:grid;grid-template-columns:28px minmax(0,1fr) 96px 140px 56px 90px 56px 20px;padding:8px 14px;gap:12px;background:var(--bg-3);color:var(--fg-mute);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--line);align-items:center}
.rt-head span{cursor:pointer;user-select:none}
.rt-head span:hover{color:var(--purple)}
.rt-head .active{color:var(--purple)}
.rt-row{display:grid;grid-template-columns:28px minmax(0,1fr) 96px 140px 56px 90px 56px 20px;align-items:center;padding:8px 14px;gap:12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background 100ms;min-height:38px}
.rt-row:last-child{border-bottom:0}
.rt-row:hover{background:var(--bg-3)}
.rt-row.dim{opacity:.55}
.rt-row .r{font-family:var(--mono);font-size:11px;color:var(--fg-mute)}
.rt-row .idea{min-width:0;overflow:hidden}
.rt-row .idea .n{font-weight:600;letter-spacing:-.1px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-row .cat{font-family:var(--mono);font-size:10px;color:var(--fg-mute);background:var(--bg-3);padding:2px 7px;border-radius:99px;display:inline-block;justify-self:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rt-row .sc{font-family:var(--mono);font-size:14px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.sc.hi{color:var(--green)}.sc.md{color:var(--yellow)}.sc.lo{color:var(--red-text)}
.rt-row .mini{display:flex;align-items:flex-end;gap:2px;height:14px}
.rt-row .mini .b{width:6px;background:var(--fg-dim);border-radius:1px;transition:background 100ms;min-height:1px}
.rt-row .mini .b.top{background:var(--purple)}
.rt-row .flags{display:flex;gap:3px;flex-wrap:nowrap;overflow:hidden}
.rt-row .flags .chip{padding:2px 6px;font-size:9.5px}
.rt-row .oc .chip{padding:2px 7px;font-size:9.5px}
.rt-row .caret{color:var(--fg-dim);text-align:center;font-family:var(--mono);font-size:12px}

/* chips */
.chip{padding:3px 8px;border-radius:99px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;border:1px solid transparent}
.chip.o-adv{background:var(--green-soft);color:var(--green);border-color:rgba(124,219,168,0.32)}
.chip.o-inv{background:var(--yellow-soft);color:var(--yellow);border-color:rgba(242,193,78,0.32)}
.chip.o-park{background:var(--purple-soft);color:var(--purple);border-color:var(--purple-line)}
.chip.o-kill{background:var(--red-soft);color:var(--red-text);border-color:rgba(171,20,16,0.42)}
.chip.pat{background:var(--purple-soft);color:var(--purple);border-color:var(--purple-line)}
.chip.arch{background:var(--bg-3);color:var(--fg)}
.chip.ca{background:rgba(255,255,255,0.05);color:var(--fg);border-color:var(--line-2)}
.chip.exp{background:var(--orange-soft);color:var(--orange);border-color:var(--orange-line)}
.chip.mflag{background:var(--orange-soft);color:var(--orange);border-color:var(--orange-line)}
.chip.hi{background:rgba(239,107,103,0.14);color:var(--red-text);border-color:rgba(171,20,16,0.42)}

/* ---------- tldr ---------- */
.tldr{background:var(--bg-2);border:1px solid var(--line);border-left:3px solid var(--purple);border-radius:6px;padding:20px 22px;margin-bottom:44px}
.tldr .h{color:var(--purple);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:12px}
.tldr ul{margin:0;padding-left:20px;color:var(--fg-mute)}
.tldr li{margin-bottom:6px;font-size:13.5px;line-height:1.6}
.tldr li strong{color:var(--fg);font-weight:600}

/* ---------- section header ---------- */
.section-h{color:var(--purple);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.3px;margin:44px 0 16px;display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.section-h .sub{color:var(--fg-dim);font-size:11px;font-weight:500;letter-spacing:.3px;text-transform:none}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.control{background:var(--bg-2);border:1px solid var(--line);border-radius:6px;padding:8px 12px;color:var(--fg-mute);font-size:12px;cursor:pointer;font-family:var(--sans)}
.control:hover{color:var(--fg);border-color:var(--line-2)}
.control.active{color:var(--purple);border-color:var(--purple-line);background:var(--purple-soft)}
input.control{width:220px;cursor:text}
input.control:focus{outline:none;border-color:var(--purple-line)}
select.control{cursor:pointer}
.copy-btn{background:var(--purple);color:var(--bg);border:0;border-radius:6px;padding:8px 14px;font-family:var(--sans);font-size:12px;font-weight:600;cursor:pointer;letter-spacing:.2px}
.copy-btn:hover{filter:brightness(1.08)}

/* ---------- cards ---------- */
.cards{display:flex;flex-direction:column;gap:14px}
.card{background:var(--bg-2);border:1px solid var(--line);border-left:3px solid var(--fg-dim);border-radius:10px;overflow:hidden}
.card.adv{border-left-color:var(--green)}
.card.inv{border-left-color:var(--yellow)}
.card.park{border-left-color:var(--purple)}
.card.kill{border-left-color:var(--red-text)}
.card-head{display:grid;grid-template-columns:52px 1fr auto auto;gap:16px;padding:18px 22px;align-items:start;cursor:pointer;user-select:none}
.card-head:hover{background:rgba(255,255,255,0.02)}
.card-head .r{font-family:var(--mono);font-size:13px;color:var(--fg-mute);font-weight:600;padding-top:2px}
.card-head .title{display:flex;flex-direction:column;gap:6px}
.card-head .title .n{font-size:16.5px;font-weight:600;letter-spacing:-.2px;line-height:1.35}
.card-head .title .o{color:var(--fg-mute);font-size:13px;line-height:1.5}
.card-head .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.card-head .weight{text-align:right}
.card-head .weight .s{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1;color:var(--fg)}
.card-head .weight .s.hi{color:var(--green)}
.card-head .weight .s.md{color:var(--yellow)}
.card-head .weight .s.lo{color:var(--red-text)}
.card-head .weight .l{color:var(--fg-dim);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.card-head .caret{color:var(--fg-dim);font-family:var(--mono);font-size:16px;padding-top:2px}
.card-body{border-top:1px solid var(--line);padding:22px 24px 26px;display:none;flex-direction:column;gap:22px}
.card.open .card-body{display:flex}
.card.open .card-head .caret{transform:rotate(90deg)}
.card-head .caret{transition:transform 150ms}

/* body sections */
.sig{background:var(--purple-soft);border:1px solid var(--purple-line);border-radius:6px;padding:12px 16px;font-family:var(--mono);font-size:12.5px;color:var(--fg);line-height:1.55;display:flex;gap:10px;align-items:flex-start}
.sig .k{color:var(--purple);font-weight:700;flex-shrink:0}
.exp-callout{background:var(--orange-soft);border:1px solid var(--orange-line);border-radius:6px;padding:12px 16px;font-size:13px;color:var(--fg);line-height:1.55}
.exp-callout .k{color:var(--orange);font-weight:700;font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}

.plain{background:rgba(200,204,255,0.06);border-left:2px solid var(--purple);border-radius:0 4px 4px 0;padding:12px 16px;font-size:13.5px;color:var(--fg-mute);line-height:1.6;font-style:italic}
.plain .k{color:var(--purple);font-weight:600;font-style:normal;text-transform:uppercase;font-size:10.5px;letter-spacing:1px;margin-bottom:4px;display:block}

.sec-lbl{color:var(--purple);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px}

.rubric{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.rubric .c{background:var(--bg-3);border-radius:6px;padding:10px 8px;display:flex;flex-direction:column;gap:6px;align-items:center;cursor:pointer;transition:background 100ms}
.rubric .c:hover{background:rgba(255,255,255,0.06)}
.rubric .c.dim{opacity:.55}
.rubric .c .k{font-family:var(--mono);font-size:9.5px;color:var(--fg-mute);text-transform:uppercase;letter-spacing:.7px}
.rubric .c .v{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--fg)}
.rubric .c .bar{width:100%;height:4px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden}
.rubric .c .bar>span{display:block;height:100%;background:var(--purple);border-radius:2px}
.rubric .c.dim .bar>span{background:var(--fg-dim)}

/* three clocks */
.clocks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.clock{border-top:2px solid var(--line-2);background:var(--bg-3);border-radius:0 0 6px 6px;padding:12px 14px}
.clock.rung{border-top-color:var(--green)}
.clock.closing{border-top-color:var(--orange)}
.clock.late{border-top-color:var(--red-text)}
.clock .k{font-family:var(--mono);font-size:10.5px;color:var(--fg-mute);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.clock .k .gl{font-size:11px}
.clock.rung .k .gl{color:var(--green)}
.clock.closing .k .gl{color:var(--orange)}
.clock .body{font-size:12.5px;color:var(--fg);line-height:1.5;margin-bottom:8px}
.clock .date{font-family:var(--mono);font-size:11px;color:var(--fg-mute)}
.verdict{background:var(--purple-soft);border:1px solid var(--purple-line);border-radius:6px;padding:12px 16px;margin-top:10px}
.verdict .k{color:var(--purple);font-family:var(--mono);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.verdict .v{font-size:13.5px;color:var(--fg);line-height:1.55}
.verdict .badge{display:inline-block;padding:2px 8px;background:var(--bg);border-radius:99px;font-family:var(--mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-right:6px;color:var(--purple)}

.hyp{background:var(--bg-3);border-radius:6px;padding:14px 16px;font-size:13.5px;color:var(--fg);line-height:1.6}
.hyp .k{color:var(--yellow);font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-right:6px;background:var(--yellow-soft);padding:2px 6px;border-radius:99px;display:inline-block;margin-right:8px}

/* margin layers */
.mlayers{display:flex;gap:6px;flex-wrap:wrap}
.mlayer{background:var(--bg-3);border-radius:99px;padding:6px 12px;display:flex;align-items:center;gap:8px;font-size:12px}
.mlayer .l{font-family:var(--mono);font-size:9.5px;color:var(--purple);text-transform:uppercase;letter-spacing:.7px;font-weight:700}
.mlayer .w{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--fg)}
.mlayer .n{color:var(--fg-mute);font-size:11.5px;border-left:1px solid var(--line-2);padding-left:8px;margin-left:2px}

/* TAM block */
.tam{background:var(--bg-3);border-radius:8px;padding:16px}
.tam .rc{background:var(--bg);border:1px solid var(--orange-line);border-radius:6px;padding:10px 14px;margin-bottom:12px;font-size:12.5px;color:var(--fg)}
.tam .rc b{color:var(--orange);font-weight:600}
.tam-methods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tam-method{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.tam-method .k{color:var(--purple);font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.tam-method .a{font-family:var(--mono);font-size:11.5px;color:var(--fg-mute);line-height:1.5;margin-bottom:8px}
.tam-method .s{color:var(--fg-dim);font-size:10.5px;font-style:italic;margin-bottom:8px}
.tam-method .r{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--fg)}
.tam .base{background:var(--purple-soft);border:1px solid var(--purple-line);border-radius:6px;padding:10px 14px;margin-bottom:10px;font-size:13px;color:var(--fg)}
.tam .base b{color:var(--purple);font-weight:600;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-right:8px}
.tam .san{border-left:2px solid var(--fg-dim);padding-left:12px;font-size:12px;color:var(--fg-mute);line-height:1.55}

/* competitor triad */
.triad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tcol{background:var(--bg-3);border-radius:6px;padding:12px 14px}
.tcol .k{color:var(--purple);font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
.tcol .entry{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px;font-size:12.5px}
.tcol .entry:last-child{border-bottom:0;padding-bottom:0;margin-bottom:0}
.tcol .entry .n{font-weight:600;color:var(--fg);margin-bottom:2px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.tcol .entry .meta{color:var(--fg-mute);font-size:11px;font-family:var(--mono)}
.tcol .entry .note{color:var(--fg-mute);font-size:12px;line-height:1.5;margin-top:4px}
.thr{padding:2px 6px;border-radius:99px;font-family:var(--mono);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.thr.HIGH{background:rgba(239,107,103,0.16);color:var(--red-text)}
.thr.MED{background:var(--yellow-soft);color:var(--yellow)}
.thr.LOW{background:var(--bg-3);color:var(--fg-mute)}
.thr.MED-HIGH{background:rgba(239,107,103,0.10);color:var(--yellow)}
.thr.LOW-MED{background:var(--bg-3);color:var(--fg-mute)}
.thr.VERY.HIGH{background:rgba(239,107,103,0.28);color:var(--red-text)}
.statusquo{background:var(--orange-soft);border:1px dashed var(--orange-line);border-radius:6px;padding:12px 16px;margin-top:12px}
.statusquo .k{color:var(--orange);font-family:var(--mono);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.statusquo .v{color:var(--fg);font-size:13px;line-height:1.55}

/* counter-case */
.counter{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.counter .b{background:var(--bg-3);border-left:3px solid var(--yellow);border-radius:0 6px 6px 0;padding:12px 14px}
.counter .b .k{color:var(--yellow);font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.counter .b .v{font-size:12.5px;color:var(--fg);line-height:1.55}

/* risks */
.risks{display:flex;flex-direction:column;gap:8px}
.risk{background:var(--bg-3);border-radius:6px;padding:12px 14px}
.risk .rh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.risk .rh .tp{padding:3px 8px;border-radius:99px;font-family:var(--mono);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.risk .rh .tp.condition{background:var(--yellow-soft);color:var(--yellow)}
.risk .rh .tp.actor-move{background:var(--orange-soft);color:var(--orange)}
.risk .rh .lk{padding:3px 8px;border-radius:99px;font-family:var(--mono);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.risk .rh .lk.high{background:rgba(255,89,0,0.2);color:var(--orange)}
.risk .rh .lk.medium-high{background:rgba(255,89,0,0.15);color:var(--orange)}
.risk .rh .lk.medium{background:var(--yellow-soft);color:var(--yellow)}
.risk .rh .lk.low-medium,.risk .rh .lk.medium-low{background:rgba(242,193,78,0.10);color:var(--fg-mute)}
.risk .rh .lk.low{background:var(--bg-inset);color:var(--fg-mute)}
.risk .rh .lk.very.high{background:rgba(255,89,0,0.28);color:var(--orange)}
.risk .rh .lk.certain{background:rgba(171,20,16,0.24);color:var(--red-text)}
.risk .mech{font-size:12.5px;color:var(--fg);line-height:1.55;margin-bottom:8px}
.risk .mech b{color:var(--fg);font-weight:600}
.risk .resp{background:var(--purple-soft);border-radius:4px;padding:8px 12px;font-size:12px;color:var(--fg);line-height:1.5}
.risk .resp b{color:var(--purple);font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:.6px;margin-right:6px}

/* right-to-win assets */
.rtw{display:flex;flex-direction:column;gap:10px}
.rtw-asset{background:var(--bg-3);border-radius:6px;padding:12px 14px}
.rtw-asset .h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.rtw-asset .n{font-weight:600;color:var(--fg);font-size:13px;line-height:1.4;flex:1 1 auto}
.stress{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.stress .b{background:var(--bg);padding:4px 8px;border-radius:99px;font-family:var(--mono);font-size:10.5px;color:var(--fg);border:1px solid var(--line-2);display:inline-flex;gap:4px;align-items:center}
.stress .b.pass{color:var(--green);border-color:rgba(124,219,168,0.32)}
.stress .b.fail{color:var(--red-text);border-color:rgba(171,20,16,0.42)}
.aff{background:var(--bg-inset);border-radius:4px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:11.5px;color:var(--fg-mute);align-items:baseline}
.aff .k{color:var(--fg-dim);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:700}
.aff .v{color:var(--fg)}
.aff .v.hypo{color:var(--orange);font-style:italic}
.honestgaps{background:var(--yellow-soft);border:1px dashed rgba(242,193,78,0.32);border-radius:6px;padding:12px 16px;margin-top:8px}
.honestgaps .k{color:var(--yellow);font-family:var(--mono);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.honestgaps .v{color:var(--fg);font-size:12.5px;line-height:1.55}

/* margin flag / kill risk */
.mflag-box{background:var(--orange-soft);border:1px solid var(--orange-line);border-radius:6px;padding:12px 16px}
.mflag-box .k{color:var(--orange);font-family:var(--mono);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.mflag-box .v{color:var(--fg);font-size:12.5px;line-height:1.55}
.kill-box{background:var(--red-soft);border:1px solid rgba(171,20,16,0.42);border-radius:6px;padding:12px 16px}
.kill-box .k{color:var(--red-text);font-family:var(--mono);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.kill-box .v{color:var(--fg);font-size:12.5px;line-height:1.55}

/* generic named-section */
.named{background:var(--bg-3);border-radius:6px;padding:14px 16px;font-size:13px;color:var(--fg);line-height:1.6}

/* landscape */
.landscape-table{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lt-head{display:grid;grid-template-columns:1.4fr 90px 130px 3fr;padding:12px 18px;gap:12px;background:var(--bg-3);color:var(--fg-mute);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--line)}
.lt-row{display:grid;grid-template-columns:1.4fr 90px 130px 3fr;padding:12px 18px;gap:12px;border-bottom:1px solid var(--line);align-items:center;font-size:12.5px}
.lt-row:last-child{border-bottom:0}
.lt-row .cl{font-weight:600;color:var(--fg)}
.lt-row .cl .cn{font-size:12px;color:var(--fg-mute);margin-top:4px;font-family:var(--mono)}
.lt-row .n{font-family:var(--mono);font-weight:600;color:var(--fg)}
.lt-row .n .p{color:var(--fg-mute);font-weight:400;font-size:11px}
.gap-chip{padding:4px 10px;border-radius:99px;font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;display:inline-block}
.gap-chip.saturated{background:var(--red-soft);color:var(--red-text)}
.gap-chip.whitespace{background:var(--green-soft);color:var(--green)}
.gap-chip.forming{background:var(--yellow-soft);color:var(--yellow)}
.lt-row .note{color:var(--fg-mute);font-size:12px;line-height:1.5}
.lt-row .note .cov{color:var(--purple);font-family:var(--mono);font-size:10.5px;font-weight:700;margin-top:6px;display:inline-block;padding:2px 8px;background:var(--purple-soft);border-radius:99px;letter-spacing:.4px}
.lt-row .ca{color:var(--fg-dim);font-size:11px;margin-top:4px;font-style:italic}

/* footer */
footer{margin-top:64px;padding:24px 0;border-top:1px solid var(--line);color:var(--fg-mute);font-size:12px;line-height:1.6}
footer .r{margin-top:8px;color:var(--fg-dim);font-size:11px;font-family:var(--mono)}

/* toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg-2);border:1px solid var(--purple-line);color:var(--fg);padding:12px 18px;border-radius:8px;font-size:13px;box-shadow:0 8px 32px rgba(0,0,0,0.4);z-index:1000;opacity:0;transform:translateY(10px);transition:all 200ms}
.toast.show{opacity:1;transform:translateY(0)}

/* responsive */
@media (max-width:900px){
  main{padding:20px 16px 64px}
  .stats{grid-template-columns:repeat(3,1fr)}
  .rt-head,.rt-row{grid-template-columns:32px 1fr 60px 32px;gap:8px}
  .rt-head .rc,.rt-head .rmini,.rt-head .rfl,.rt-head .rcat,
  .rt-row .cat,.rt-row .mini,.rt-row .flags,.rt-row .oc{display:none}
  .rubric{grid-template-columns:repeat(4,1fr)}
  .clocks,.triad,.counter,.tam-methods{grid-template-columns:1fr}
  .lt-head,.lt-row{grid-template-columns:1fr 60px 100px}
  .lt-head .lnote,.lt-row .note{display:none}
}

<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('tof-data').textContent);
const R = DATA.run, L = DATA.landscape, E = DATA.explored;
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS_OVR = 'tof-overrides-v1', LS_OPEN='tof-open-v1', LS_NAME='tof-user-name-v1';
function LSget(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function LSset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const overrides = LSget(LS_OVR,{});
const openState = LSget(LS_OPEN,{});

// weightedScore recompute (with overrides)
const W={pain:.20,market:.20,timing:.15,solution:.15,advantage:.15,impact:.10,defensibility:.05};
function effectiveScores(c){
  const s={...c.scores};
  Object.keys(W).forEach(k=>{
    const o = overrides[c.id+':'+k];
    if(o!=null && !isNaN(o)) s[k]=Math.max(1,Math.min(5,o));
  });
  return s;
}
function weight(c){const s=effectiveScores(c);return +Object.keys(W).reduce((a,k)=>a+s[k]*W[k],0).toFixed(2)}
function scoreColorClass(w){return w>=3.5?'hi':(w>=2.8?'md':'lo')}

// HEADER
$('#rundate').textContent = R.runDate + ' &#183; ' + R.runMode;
$('#subline').innerHTML = R.extractSources.map(esc).join('<span class="sep">&#183;</span>') +
  '<span class="sep">&#183;</span>' + R.streams + ' streams<span class="sep">&#183;</span>doctrine ' + esc(R.doctrineVersion);
const stats = [
  {k:'Companies',v:R.unifiedCount.toLocaleString(),cls:''},
  {k:'Canadian',v:R.canadianCount,cls:'p'},
  {k:'Advance',v:R.counts.advance,cls:'g'},
  {k:'Investigate',v:R.counts.investigate,cls:'y'},
  {k:'Park',v:R.counts.park,cls:'p'},
  {k:'Kill',v:R.counts.kill,cls:'r'}
];
$('#stats').innerHTML = stats.map(s=>`<div class="stat ${s.cls}"><div class="k">${s.k}</div><div class="v">${s.v}</div></div>`).join('');

// TL;DR
const tldr = [
  `<strong>2 clean ADVANCEs</strong> in this run &#8212; <em>Heat-pump installer marketplace</em> (4.10) and <em>Grid-edge DER orchestrator</em> (3.95). Both ride Ontario 2026 regulatory catalysts (HRS rebate + IESO DSC amendment May 1). Launch-customer intro is the single blocker on each.`,
  `<strong>Data-center flex-load</strong> (3.60) escalated to ADVANCE despite thin right-to-win because Meta Sturgeon County 970 MW timing forces a 4-week window: identify the Canadian wedge (co-locator or AESO regulatory partnership) or lose the space to Emerald AI.`,
  `<strong>3 cards flagged previously-explored with new evidence:</strong> Grid DER (Cellera #29 &#8212; regulatory catalyst now real), Heat-pump marketplace (Home Electrification #37 &#8212; HRS + Greener Homes closure consolidates channel), Cold-chain (#42 &#8212; redundant, fold in).`,
  `<strong>Wildfire cluster is dense but head-started</strong>: Skyward (lightning) + FireSwarm/Shearwater/Arcanus (suppression drones) &#8212; 3 concurrent Canadian 2026 rounds. Head-on entry fails kill test; only paths are acquisition or insurance-channel flanking.`,
  `<strong>2 KILLs retained as landscape:</strong> SMR (capital + timeline not studio-shaped) and DAC (Carbon Engineering already Canadian anchor). Per full-retention doctrine, visible not filtered.`,
  `<strong>Archetype spread:</strong> software (5), asset-owner-operator (4), physical (3), marketplace (1), tech-enabled service (1) &#8212; 5 archetypes. Passes the archetype-spread rule.`
];
$('#tldr').innerHTML = '<div class="h">TL;DR &#8212; what to do next</div><ul>'+tldr.map(t=>`<li>${t}</li>`).join('')+'</ul>';

// helpers
function outcomeChip(o){return `<span class="chip o-${o==='advance'?'adv':o==='investigate'?'inv':o}">${o.toUpperCase()}</span>`;}
function tinyRubric(c){
  const s=effectiveScores(c); const max=Math.max(...Object.values(s));
  return `<div class="mini">`+Object.entries(s).map(([k,v])=>{const top=(v===max);return `<span class="b${top?' top':''}" style="height:${v*20}%" title="${k}: ${v}"></span>`}).join('')+`</div>`;
}
function flagChips(c){
  const chips=[];
  if(c.country==='Canada') chips.push('<span class="chip ca">&#127464;&#127462; CA</span>');
  if(c.previouslyExplored) chips.push(`<span class="chip exp">&#9672; #${c.previouslyExplored.number}</span>`);
  if(c.marginFlag) chips.push('<span class="chip mflag">&#9888; margin</span>');
  const hi=(c.keyRisks||[]).some(r=>/(^|\W)high($|\W)/i.test(r.likelihood||''));
  if(hi) chips.push('<span class="chip hi">&#128314; risk</span>');
  return chips.join('');
}

// RANKING TABLE
function renderRank(){
  const cards=[...R.cards].sort((a,b)=>weight(b)-weight(a));
  const html=[`<div class="rt-head">
    <span data-s="rank">#</span>
    <span data-s="name">Idea</span>
    <span data-s="outcome" class="oc">Outcome</span>
    <span data-s="category" class="rcat">Category</span>
    <span data-s="score">Score</span>
    <span class="rmini">Rubric</span>
    <span class="rfl">Flags</span>
    <span></span>
  </div>`];
  cards.forEach((c,i)=>{
    const w=weight(c); const sc=scoreColorClass(w);
    html.push(`<div class="rt-row ${c.outcome==='kill'?'dim':''}" data-id="${esc(c.id)}" title="${esc(c.oneLiner)}">
      <div class="r">${i+1}</div>
      <div class="idea"><div class="n">${esc(c.name)}</div></div>
      <div class="oc">${outcomeChip(c.outcome)}</div>
      <div><span class="cat">${esc(c.category)}</span></div>
      <div class="sc ${sc}">${w.toFixed(2)}</div>
      <div>${tinyRubric(c)}</div>
      <div class="flags">${flagChips(c)}</div>
      <div class="caret">&#8250;</div>
    </div>`);
  });
  $('#ranktable').innerHTML=html.join('');
  $$('.rt-row').forEach(r=>{
    r.addEventListener('click',()=>{
      const id=r.getAttribute('data-id');
      const el=document.getElementById('card-'+id);
      if(el){ if(!el.classList.contains('open')){el.classList.add('open'); openState[id]=true; LSset(LS_OPEN,openState);}
        el.scrollIntoView({behavior:'smooth',block:'start'});
      }
    });
  });
}

// CARDS
function renderCards(){
  const search=$('#search').value.toLowerCase().trim();
  const f_out=$('#filter-outcome').value;
  const sort=$('#sort').value;
  let cards=R.cards.filter(c=>{
    if(f_out && c.outcome!==f_out) return false;
    if(search){
      const t=(c.name+' '+c.oneLiner+' '+c.signal+' '+(c.painPoint||'')+' '+(c.solution||'')+' '+c.category).toLowerCase();
      if(!t.includes(search)) return false;
    }
    return true;
  });
  if(sort==='score') cards.sort((a,b)=>weight(b)-weight(a));
  else if(sort==='name') cards.sort((a,b)=>a.name.localeCompare(b.name));
  else if(sort==='category') cards.sort((a,b)=>(a.category||'').localeCompare(b.category||''));
  else if(sort==='outcome'){
    const rk={advance:1,investigate:2,park:3,kill:4};
    cards.sort((a,b)=>(rk[a.outcome]-rk[b.outcome])||(weight(b)-weight(a)));
  } else cards.sort((a,b)=>a.rank-b.rank);
  $('#cardcount').textContent = `${cards.length} of ${R.cards.length}`;
  $('#cards').innerHTML = cards.map(renderCard).join('');
  attachHandlers();
}
function renderCard(c){
  const w=weight(c); const sc=scoreColorClass(w);
  const oclass=c.outcome==='advance'?'adv':c.outcome==='investigate'?'inv':c.outcome;
  const chips=[
    outcomeChip(c.outcome),
    `<span class="chip pat">&#8599; ${esc(c.breakInPattern)}</span>`,
    `<span class="chip arch">${esc(c.archetype)}</span>`,
    c.country==='Canada'?'<span class="chip ca">&#127464;&#127462; Canada</span>':'',
    c.previouslyExplored?`<span class="chip exp">&#9672; #${c.previouslyExplored.number} ${esc(c.previouslyExplored.name)}</span>`:''
  ].filter(Boolean).join('');
  const isOpen = openState[c.id]===true;
  return `<article class="card ${oclass} ${isOpen?'open':''}" id="card-${esc(c.id)}" data-id="${esc(c.id)}">
    <div class="card-head">
      <div class="r">#${c.rank}</div>
      <div class="title">
        <div class="n">${esc(c.name)}</div>
        <div class="o">${esc(c.oneLiner)}</div>
        <div class="chips">${chips}</div>
      </div>
      <div class="weight"><div class="s ${sc}">${w.toFixed(2)}</div><div class="l">Weighted</div></div>
      <div class="caret">&#9654;</div>
    </div>
    <div class="card-body">${renderBody(c)}</div>
  </article>`;
}
function renderBody(c){
  const s=effectiveScores(c); const max=Math.max(...Object.values(s));
  const rubricKeys=['pain','market','timing','solution','advantage','impact','defensibility'];
  const rubric = `<div><div class="sec-lbl">Rubric &#8212; click any score to override</div><div class="rubric">${rubricKeys.map(k=>{
    const v=s[k]; const top=v===max; const dim=k==='defensibility';
    return `<div class="c ${dim?'dim':''}" data-cid="${esc(c.id)}" data-crit="${k}"><div class="k">${k}</div><div class="v">${v}</div><div class="bar"><span style="width:${v*20}%"></span></div></div>`
  }).join('')}</div></div>`;

  // clocks
  const tc=c.threeClocks||{};
  const cl_e=tc.enabling||{}; const cl_b=tc.budget||{}; const cl_c=tc.competitive||{};
  const clocks=`<div><div class="sec-lbl">Three clocks (v3) &#8212; dated prediction the whole card commits to</div>
    <div class="clocks">
      <div class="clock ${cl_e.rung?'rung':''}"><div class="k">enabling <span class="gl">${cl_e.rung?'&#10003; rung':'&#9675; unrung'}</span></div>
        <div class="body">${esc(cl_e.evidence||'')}</div><div class="date">Rang: ${esc(cl_e.date||'&#8212;')}</div></div>
      <div class="clock ${cl_b.rung?'rung':''}"><div class="k">budget <span class="gl">${cl_b.rung?'&#10003; rung':'&#9675; unrung'}</span></div>
        <div class="body">${esc(cl_b.evidence||'')}</div><div class="date">First purchase: ${esc(cl_b.firstPurchaseDate||'&#8212;')}</div></div>
      <div class="clock ${cl_c.status==='closing'?'closing':cl_c.status==='closed'?'late':''}"><div class="k">competitive <span class="gl">${cl_c.status==='closing'?'&#9888; closing':cl_c.status==='closed'?'&#10007; closed':'&#9675; open'}</span></div>
        <div class="body">${esc(cl_c.closingEvent||'')}</div><div class="date">Closing by: ${esc(cl_c.closingBy||'&#8212;')}</div></div>
    </div>
    <div class="verdict"><div class="k">verdict &#8212; dated prediction</div><div class="v"><span class="badge">${esc(tc.verdict||'')}</span>${esc(tc.datedPrediction||'')}</div></div>
  </div>`;

  // pain / solution
  const pain=`<div><div class="sec-lbl">Pain point (hypothesis)</div><div class="hyp"><span class="k">HYPOTHESIS</span>${esc((c.painPoint||'').replace(/^HYPOTHESIS\.\s*/,''))}</div></div>`;
  const solution=`<div><div class="sec-lbl">Solution hypothesis</div><div class="named">${esc(c.solution||'')}</div></div>`;

  // margin layers
  const ml=(c.marginLayers||[]).map(m=>`<div class="mlayer"><span class="l">${esc(m.layer)}</span><span class="w">${m.weightPct}%</span><span class="n">${esc(m.note||'')}</span></div>`).join('');
  const marginLayers=`<div><div class="sec-lbl">Margin layers &#8212; where the &gt;60% comes from</div><div class="mlayers">${ml}</div></div>`;

  // TAM
  const methods=(c.tamMethodology||[]).map(m=>`<div class="tam-method">
    <div class="k">${esc(m.method)}</div>
    <div class="a">${esc(m.arithmetic)}</div>
    <div class="s">${esc(m.sourceComparable)}</div>
    <div class="r">${esc(m.result)}</div></div>`).join('');
  const tam=`<div><div class="sec-lbl">TAM (v3 methodology) &#8212; &#8805;2 methods, cross-checked</div>
    <div class="tam">
      <div class="rc"><b>Reference cost base &#8800; TAM.</b> ${esc(c.referenceCostBase||'')}</div>
      <div class="tam-methods">${methods}</div>
      <div class="base"><b>Base TAM</b>${esc(c.tamBase||'')}</div>
      <div class="san">${esc(c.buyerLevelSanity||'')}</div>
    </div></div>`;

  // competitor triad
  const comp=c.competitors||{};
  const direct=(comp.direct||[]).map(x=>`<div class="entry"><div class="n">${esc(x.name)} <span class="thr ${(x.threat||'').replace(/\s+/g,'.')}">${esc(x.threat||'')}</span></div><div class="meta">${esc(x.founded||'?')} &#183; ${esc(x.funding||'?')} &#183; ${esc(x.geography||'?')}</div></div>`).join('');
  const subs=(comp.substitutes||[]).map(x=>`<div class="entry"><div class="n">${esc(x.name)}</div><div class="note">${esc(x.note||'')}</div></div>`).join('');
  const adj=(comp.adjacentExtenders||[]).map(x=>`<div class="entry"><div class="n">${esc(x.name)}</div><div class="note"><b>Not direct because:</b> ${esc(x.structuralReasonNotDirect||'')}</div></div>`).join('');
  const triad=`<div><div class="sec-lbl">Competitor triad &#8212; direct / substitute / adjacent extender (v3)</div>
    <div class="triad">
      <div class="tcol"><div class="k">direct</div>${direct||'<div class="entry"><div class="note" style="color:var(--fg-dim)">none identified</div></div>'}</div>
      <div class="tcol"><div class="k">substitutes</div>${subs}</div>
      <div class="tcol"><div class="k">adjacent extenders</div>${adj}</div>
    </div>
    <div class="statusquo"><div class="k">Status quo (real incumbent &#8212; mandatory v3 field)</div><div class="v">${esc(c.statusQuo||'')}</div></div>
  </div>`;

  // counter-case
  const counter=`<div><div class="sec-lbl">Counter-case (mandatory)</div>
    <div class="counter">
      <div class="b"><div class="k">graveyard &#8212; who tried this ~2012-2020 &amp; cause of death</div><div class="v">${esc(c.graveyard||'')}</div></div>
      <div class="b"><div class="k">three-year counterfactual &#8212; could this have been built in 2023?</div><div class="v">${esc(c.threeYearCounterfactual||'')}</div></div>
    </div></div>`;

  // key risks
  const risks=(c.keyRisks||[]).slice(0,5).map(r=>{
    const lk=(r.likelihood||'').toLowerCase().split(/[\s&#8212;-]/)[0].replace(/[^a-z-]/g,'');
    return `<div class="risk">
      <div class="rh"><span class="tp ${r.type}">${esc(r.type)}</span><span class="lk ${lk}">${esc((r.likelihood||'').split('&#8212;')[0].trim())}</span></div>
      <div class="mech"><b>${esc(r.subject)}</b> &#8212; ${esc(r.mechanism)}</div>
      <div class="resp"><b>If it happens:</b> ${esc(r.response)}</div>
    </div>`;
  }).join('');
  const overCap = (c.keyRisks||[]).length>5?`<div style="color:var(--orange);font-size:11.5px;margin-top:6px;font-family:var(--mono)">&#9888; spec cap is 3-5 &#8212; ${(c.keyRisks||[]).length} shown, ranking work may not be done</div>`:'';
  const riskBlock=`<div><div class="sec-lbl">Key risks &amp; questions (3-5 items)</div><div class="risks">${risks}</div>${overCap}</div>`;

  // climate impact
  const climate=`<div><div class="sec-lbl">Climate impact</div><div class="named">${esc(c.climateImpact||'')}</div></div>`;

  // right to win
  const rtwEntries=(c.unfairAdvantage||[]).map(u=>{
    const st=u.stressTest||{};
    return `<div class="rtw-asset">
      <div class="h"><div class="n">${esc(u.assetName||'')}</div><span class="chip pat">${esc(u.category||'')}</span></div>
      <div class="stress">
        <span class="b ${st.specific?'pass':'fail'}">Specific ${st.specific?'&#10003;':'&#10007;'}</span>
        <span class="b">Head-start: ${esc(String(st.headStart||'&#8212;'))}</span>
        <span class="b ${st.exclusive?'pass':'fail'}">Exclusive ${st.exclusive?'&#10003;':'&#10007;'}</span>
        <span class="b ${st.relevant?'pass':'fail'}">Relevant ${st.relevant?'&#10003;':'&#10007;'}</span>
      </div>
      <div class="aff">
        <span class="k">primary rel</span><span class="v">${esc(u.affinityCheck?.primaryRelationship||'&#8212;')}</span>
        <span class="k">owner</span><span class="v">${esc(u.affinityCheck?.internalOwner||'&#8212;')}</span>
        <span class="k">last contact</span><span class="v">${esc(u.affinityCheck?.lastContactDate||'&#8212;')}</span>
        <span class="k">logged</span><span class="v ${/hypothetical/i.test(u.affinityCheck?.loggedConversationsOnTheme||'')?'hypo':''}">${esc(u.affinityCheck?.loggedConversationsOnTheme||'&#8212;')}</span>
      </div>
    </div>`;
  }).join('');
  const gaps=c.honestGaps?`<div class="honestgaps"><div class="k">Honest gaps (mandatory)</div><div class="v">${esc(c.honestGaps)}</div></div>`:`<div class="honestgaps" style="background:var(--red-soft);border-color:rgba(171,20,16,0.42)"><div class="k" style="color:var(--red-text)">&#9888; honest gaps missing</div><div class="v">Right-to-win section is cheerleading &#8212; reject the card until populated.</div></div>`;
  const rtw=`<div><div class="sec-lbl">Unfair advantage &#8212; ${(c.unfairAdvantage||[]).length} candidate assets</div><div class="rtw">${rtwEntries}</div>${gaps}</div>`;

  // margin flag (optional)
  const marginFlag = c.marginFlag ? `<div class="mflag-box"><div class="k">&#9888; margin flag &#8212; ${esc(c.marginFlag.level||'orange')}</div><div class="v">${esc(c.marginFlag.note||'')}</div></div>`:'';

  // kill risk
  const killRisk = c.killRisk ? `<div class="kill-box"><div class="k">kill risk (one honest line)</div><div class="v">${esc(c.killRisk)}</div></div>`:'';

  // previously-explored full callout in body
  const expCallout = c.previouslyExplored ? `<div class="exp-callout"><div class="k">&#9672; Previously explored &#8212; newco #${c.previouslyExplored.number} &#183; ${esc(c.previouslyExplored.name)}</div>${esc(c.previouslyExplored.note||'')}</div>`:'';

  // gate verdict
  const gv = `<div class="verdict" style="border-color:rgba(255,255,255,0.14);background:var(--bg-3)"><div class="k" style="color:var(--fg)">Gate verdict</div><div class="v">${esc(c.gateVerdict||'')}</div></div>`;

  // confidence + source validation
  const conf = `<div style="display:flex;gap:16px;flex-wrap:wrap;color:var(--fg-mute);font-size:11.5px;font-family:var(--mono)">
    <span>Confidence: <b style="color:var(--fg)">${esc(c.confidence||'?')}</b></span>
    <span>Source validation: <b style="color:var(--fg)">${c.sourceValidation?.score||0}/100</b> (rec ${c.sourceValidation?.recency||0} + rep ${c.sourceValidation?.reputability||0} + corr ${c.sourceValidation?.corroboration||0})</span>
  </div>`;

  return `<div class="sig"><span class="k">&#128225; SIGNAL</span><span>${esc(c.signal||'')}</span></div>
    ${expCallout}
    ${c.priorContext?`<div class="plain"><span class="k">Prior-knowledge quarantine (R3)</span>${esc(c.priorContext)}</div>`:''}
    ${rubric}
    ${clocks}
    ${pain}
    ${solution}
    ${marginLayers}
    ${tam}
    ${triad}
    ${counter}
    ${riskBlock}
    ${climate}
    ${rtw}
    ${marginFlag}
    ${killRisk}
    ${gv}
    ${conf}`;
}
function attachHandlers(){
  $$('.card').forEach(el=>{
    const head=el.querySelector('.card-head');
    head.addEventListener('click',(e)=>{
      if(e.target.closest('.rubric')) return;
      el.classList.toggle('open');
      openState[el.getAttribute('data-id')]=el.classList.contains('open');
      LSset(LS_OPEN,openState);
    });
  });
  $$('.rubric .c').forEach(el=>{
    el.addEventListener('click',(e)=>{
      e.stopPropagation();
      const cid=el.getAttribute('data-cid'); const crit=el.getAttribute('data-crit');
      const cur=overrides[cid+':'+crit]||'';
      const v=prompt(`Override ${crit} score (1-5, blank to reset):`,cur);
      if(v===null) return;
      if(v.trim()==='') delete overrides[cid+':'+crit];
      else {const n=parseInt(v);if(!isNaN(n)&&n>=1&&n<=5) overrides[cid+':'+crit]=n;}
      LSset(LS_OVR,overrides);
      renderCards(); renderRank();
      showToast('Score override saved');
    });
  });
}

// LANDSCAPE
function renderLandscape(){
  const html=[`<div class="lt-head"><span>Cluster</span><span>Input share</span><span>Canada gap</span><span class="lnote">Note</span></div>`];
  L.forEach(l=>{
    const covered=l.cardId?'<span class="cov">&#10003; covered by card</span>':'';
    const ca=l.canadianCount>0?`<div class="ca">CA: ${l.canadianCompanies.slice(0,4).join(', ')}${l.canadianCount>4?'&#8230;':''}</div>`:'';
    html.push(`<div class="lt-row">
      <div class="cl">${esc(l.label)}<div class="cn">${esc(l.cluster)}</div></div>
      <div class="n">${l.n} <span class="p">(${l.pct}%)</span></div>
      <div><span class="gap-chip ${l.gap}">${l.gap}</span></div>
      <div class="note">${esc(l.note)}${covered}${ca}</div>
    </div>`);
  });
  $('#landscape').innerHTML=html.join('');
}

// FOOTER
$('#footinfo').innerHTML = `Run generated <b style="color:var(--fg)">${R.runDate}</b> from ${R.extractSources.length} extract source${R.extractSources.length===1?'':'s'} &#183; ${L.length} clusters landscaped &#183; ${E.length} previously-explored newcos cross-checked (R6, after card drafting) &#183; doctrine ${esc(R.doctrineVersion)}.`;
$('#footmeta').textContent = 'Reasoning-only board. No calls, no memo. Every claim marked HYPOTHESIS until downstream validation. Overrides saved to your browser only.';

// TOAST + COPY
function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(showToast._t);showToast._t=setTimeout(()=>t.classList.remove('show'),2000)}
$('#copybtn').addEventListener('click',()=>{
  const out=[`Diagram TOF Run &#8212; ${R.runDate} (${R.doctrineVersion})`,''];
  ['advance','investigate','park','kill'].forEach(o=>{
    const c=R.cards.filter(x=>x.outcome===o).sort((a,b)=>weight(b)-weight(a));
    if(!c.length) return;
    out.push(o.toUpperCase()+':');
    c.forEach(x=>out.push(`  ${weight(x).toFixed(2)}  ${x.name}${x.previouslyExplored?` [prev-explored #${x.previouslyExplored.number}]`:''}`));
    out.push('');
  });
  navigator.clipboard.writeText(out.join('\n')).then(()=>showToast('Decision summary copied to clipboard'));
});
$('#expandall').addEventListener('click',()=>{R.cards.forEach(c=>openState[c.id]=true);LSset(LS_OPEN,openState);renderCards()});
$('#collapseall').addEventListener('click',()=>{R.cards.forEach(c=>openState[c.id]=false);LSset(LS_OPEN,openState);renderCards()});
$('#search').addEventListener('input',renderCards);
$('#filter-outcome').addEventListener('change',renderCards);
$('#sort').addEventListener('change',renderCards);

// INIT
renderRank();
renderCards();
renderLandscape();
// auto-open the top card
if(Object.keys(openState).length===0){
  const top=[...R.cards].sort((a,b)=>weight(b)-weight(a))[0];
  if(top){openState[top.id]=true;LSset(LS_OPEN,openState);renderCards();}
}
})();
</script>
