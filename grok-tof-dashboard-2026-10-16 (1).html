<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOF Idea Dashboard — Run 2026-10-16</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#151415;--bg-2:#1e1c1e;--bg-3:#26232a;--fg:#EDECEB;--fg-mute:rgba(237,236,235,0.62);--fg-dim:rgba(237,236,235,0.4);
 --line:rgba(237,236,235,0.09);--line-2:rgba(237,236,235,0.14);--purple:#C8CCFF;--purple-soft:rgba(200,204,255,0.14);
 --orange:#FF5900;--orange-soft:rgba(255,89,0,0.12);--red:#AB1410;--red-soft:rgba(171,20,16,0.16);--green:#7CDBA8;--yellow:#F2C14E;
 --green-soft:rgba(124,219,168,0.14);--yellow-soft:rgba(242,193,78,0.14);--kill-text:#EF6B67;
 --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
 --t:120ms ease-out;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
a{color:var(--purple);text-decoration:none}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding:32px 28px 96px}
/* header */
.hdr{border-bottom:1px solid var(--line);padding-bottom:22px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.brand-l{display:flex;align-items:center;gap:12px}
.mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--purple),#8f95f0);display:grid;place-items:center;color:#151415;font-weight:800;font-size:15px}
.brand-t{font-weight:600;font-size:13px}.brand-s{color:var(--fg-dim);font-size:12px}
.hdr-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--bg-3);border:1px solid var(--line-2);color:var(--fg);padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;transition:border-color var(--t),background var(--t),color var(--t)}
.btn:hover{border-color:var(--purple);background:#2d2a33}
.btn.primary{background:var(--purple);color:#151415;border-color:var(--purple)}
.btn.primary:hover{background:#d8dbff}
.btn.sm{padding:4px 9px;font-size:11.5px}
h1{font-size:26px;font-weight:600;letter-spacing:-.6px;margin:0 0 4px}
.subline{color:var(--fg-mute);font-size:12.5px}
.subline .sep{color:var(--fg-dim);margin:0 7px}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:22px}
.stat{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden}
.stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--fg-dim);font-weight:700}
.stat .v{font-family:var(--mono);font-size:26px;font-weight:600;margin-top:2px;letter-spacing:-.5px}
.stat .f{font-size:11px;color:var(--fg-dim);font-family:var(--mono)}
.stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc,transparent)}
/* section */
.sec{margin-top:36px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.3px;color:var(--purple)}
.sec-note{color:var(--fg-dim);font-size:12px}
/* table */
.tbl-wrap{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--fg-dim);font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
th.sortable{cursor:pointer;transition:color var(--t)}th.sortable:hover{color:var(--fg)}
th.on{color:var(--purple)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tr.row{cursor:pointer;transition:background var(--t)}tr.row:hover{background:var(--bg-3)}
tr.dim{opacity:.65}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.idea-cell{max-width:420px}.idea-cell b{font-weight:600}.idea-cell .ol{color:var(--fg-mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-family:var(--mono);font-weight:700;font-size:15px}
.s-hi{color:var(--green)}.s-mid{color:var(--yellow)}.s-lo{color:var(--kill-text)}
.score sup{font-size:9px;color:var(--fg-dim);margin-left:1px}
.minibars{display:flex;align-items:flex-end;gap:2px;height:22px}
.minibars i{display:block;width:5px;background:var(--fg-dim);border-radius:1px;opacity:.6}
.minibars i.top{background:var(--purple);opacity:1}
.flags{font-size:12px;white-space:nowrap;letter-spacing:2px}
.flags .pe{font-family:var(--mono);font-size:10.5px;color:var(--orange);letter-spacing:0}
/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap;line-height:1.4}
.o-advance{background:var(--green-soft);color:var(--green)}.o-investigate{background:var(--yellow-soft);color:var(--yellow)}
.o-park{background:var(--purple-soft);color:var(--purple)}.o-kill{background:var(--red-soft);color:var(--kill-text)}
.c-pattern{background:var(--purple-soft);color:var(--purple)}
.c-arch{background:var(--bg-3);color:var(--fg)}
.c-ca{background:rgba(237,236,235,.06);color:var(--fg-mute)}
.c-pe{background:var(--orange-soft);color:var(--orange)}
.c-cat{background:transparent;border:1px solid var(--line-2);color:var(--fg-mute)}
.t-full{border:1px solid var(--purple);color:var(--purple);background:transparent}
.t-sketch{border:1px solid var(--line-2);color:var(--fg-mute);background:transparent}
.c-star{background:var(--yellow-soft);color:var(--yellow)}
/* inspired chips */
.insp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.insp .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--fg-dim);font-weight:700;margin-right:2px}
.co{display:inline-flex;gap:7px;align-items:baseline;background:var(--bg-3);border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:12px;transition:border-color var(--t)}
.co:hover{border-color:var(--line-2)}
.co .m{font-family:var(--mono);font-size:10.5px;color:var(--fg-dim)}
/* gates */
.gates{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.gp{font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;letter-spacing:.3px;cursor:help;border:1px solid transparent}
.g-pass{background:var(--green-soft);color:var(--green)}.g-conditional{background:var(--yellow-soft);color:var(--yellow)}
.g-fail{background:var(--red-soft);color:var(--kill-text)}.g-unknown{border:1px dashed var(--line-2);color:var(--fg-dim)}
/* tldr */
.tldr{background:var(--bg-2);border:1px solid var(--line);border-left:3px solid var(--purple);border-radius:10px;padding:14px 20px;margin-top:20px}
.tldr ul{margin:6px 0 0;padding-left:18px}.tldr li{margin:4px 0;color:var(--fg)}.tldr li::marker{color:var(--purple)}
/* controls */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.input,.select{background:var(--bg-2);border:1px solid var(--line-2);color:var(--fg);border-radius:8px;padding:7px 10px;font-size:12.5px;font-family:inherit;transition:border-color var(--t)}
.input:focus,.select:focus{border-color:var(--purple);outline:none}
.input{min-width:240px}
.seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--line-2);border-radius:8px;padding:2px}
.seg button{background:transparent;border:0;color:var(--fg-mute);padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:background var(--t),color var(--t)}
.seg button.on{background:var(--bg-3);color:var(--fg)}
.clear{color:var(--fg-dim);font-size:12px;cursor:pointer;background:none;border:0}.clear:hover{color:var(--purple)}
/* cards */
.card{background:var(--bg-2);border:1px solid var(--line);border-left:3px solid var(--oc,var(--line-2));border-radius:12px;margin-bottom:12px;transition:border-color var(--t),background var(--t)}
.card:hover{border-color:var(--line-2);border-left-color:var(--oc)}
.card.advance{--oc:var(--green)}.card.investigate{--oc:var(--yellow)}.card.park{--oc:var(--fg-dim)}.card.kill{--oc:var(--red)}
.card.kill{opacity:.82}
.head{display:grid;grid-template-columns:auto 1fr auto;gap:14px;padding:16px 20px;cursor:pointer}
.rank{font-family:var(--mono);color:var(--fg-dim);font-size:12px;padding-top:2px;min-width:22px}
.title{font-size:16px;font-weight:600;letter-spacing:-.2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.title .nm{margin-right:4px}
.oneliner{color:var(--fg-mute);margin-top:3px;font-size:13px}
.hd-r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.hd-r .score{font-size:22px}
.hd-r .basis{font-size:10px;color:var(--fg-dim);font-family:var(--mono);text-transform:uppercase;letter-spacing:.6px}
.caret{color:var(--fg-dim);transition:transform var(--t);font-size:11px}
.card.open .caret{transform:rotate(90deg);color:var(--purple)}
.body-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows 150ms ease-out}
.card.open .body-wrap{grid-template-rows:1fr}
.body-inner{overflow:hidden}
.body{padding:4px 20px 20px 56px;border-top:1px solid var(--line)}
.blk{margin-top:18px}
.blk-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--purple);margin-bottom:8px;display:flex;gap:8px;align-items:center}
.blk-h .hint{color:var(--fg-dim);text-transform:none;letter-spacing:0;font-weight:500;font-size:11.5px}
.signal{font-family:var(--mono);font-size:12.5px;background:var(--purple-soft);color:var(--fg);padding:9px 12px;border-radius:8px;margin-top:16px}
.callout{padding:10px 14px;border-radius:8px;font-size:13px}
.callout.or{background:var(--orange-soft);border:1px solid rgba(255,89,0,.35)}
.callout.or.dash{border-style:dashed}
.callout.pu{background:var(--purple-soft)}
.callout.ye{background:var(--yellow-soft);border:1px dashed rgba(242,193,78,.45)}
.callout.re{background:var(--red-soft);border:1px solid rgba(171,20,16,.55)}
.callout b.t{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.callout.or b.t{color:var(--orange)}.callout.ye b.t{color:var(--yellow)}.callout.re b.t{color:var(--kill-text)}.callout.pu b.t{color:var(--purple)}
.rubric{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.rubric.q{grid-template-columns:repeat(3,1fr);max-width:480px}
.rc{background:var(--bg-3);border-radius:8px;padding:9px 10px;border:1px solid transparent;transition:border-color var(--t)}
.rc:hover{border-color:var(--line-2)}
.rc .l{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--fg-mute);font-weight:700;display:flex;justify-content:space-between}
.rc .l span{color:var(--fg-dim);font-family:var(--mono);font-weight:500}
.rc .v{font-family:var(--mono);font-size:18px;font-weight:700;cursor:pointer;display:inline-block;border-bottom:1px dashed var(--line-2)}
.rc .v:hover{color:var(--purple)}
.rc .bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.rc .bar i{display:block;height:100%;background:var(--purple);border-radius:2px;transition:width var(--t)}
.rc.prov .bar i{background:repeating-linear-gradient(90deg,var(--fg-dim) 0 4px,transparent 4px 7px)}
.rc .ed{font-size:10px;color:var(--orange);margin-top:3px}
.rc .ed a{color:var(--fg-dim);margin-left:4px;cursor:pointer}
.rc input{width:52px;background:var(--bg);border:1px solid var(--purple);color:var(--fg);border-radius:5px;font-family:var(--mono);font-size:15px;padding:2px 4px}
.tag{font-family:var(--mono);font-size:9.5px;padding:1px 5px;border-radius:4px;background:var(--bg);color:var(--fg-dim);letter-spacing:.4px;text-transform:uppercase}
.clocks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.clock{background:var(--bg-3);border-radius:8px;padding:10px 12px;border-top:2px solid var(--line-2);font-size:12.5px;display:flex;flex-direction:column}
.clock.rung{border-top-color:var(--green)}.clock.closing{border-top-color:var(--orange)}
.clock .l{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;color:var(--fg-mute);margin-bottom:4px}
.clock .d{font-family:var(--mono);font-size:11px;color:var(--fg-dim);margin-top:auto;padding-top:8px}
.srcs{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.srcs span{font-size:10.5px;background:var(--bg-2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--fg-mute)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.panel{background:var(--bg-3);border-radius:8px;padding:10px 12px;font-size:12.5px}
.panel .ph{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;color:var(--purple);margin-bottom:6px}
.panel .it{padding:6px 0;border-top:1px solid var(--line)}.panel .it:first-of-type{border-top:0;padding-top:0}
.panel .meta{font-family:var(--mono);font-size:10.5px;color:var(--fg-dim)}
.thr{font-family:var(--mono);font-size:9.5px;padding:1px 5px;border-radius:4px;margin-left:6px}
.thr-HIGH{background:var(--red-soft);color:var(--kill-text)}.thr-MED{background:var(--yellow-soft);color:var(--yellow)}.thr-LOW{background:var(--bg-2);color:var(--fg-dim)}
.ml-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-bottom:8px;gap:2px}
.ml-bar i{display:block;background:var(--purple)}
.ml-bar i:nth-child(2){opacity:.7}.ml-bar i:nth-child(3){opacity:.5}.ml-bar i:nth-child(4){opacity:.32}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--bg-3);border-radius:7px;padding:5px 9px;font-size:12px}
.pill .pl{font-size:9.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--purple);font-weight:700}
.pill .pw{font-family:var(--mono);margin-left:6px}
.tam-ref{border:1px solid var(--line-2);border-radius:8px;padding:8px 12px;font-size:12.5px;margin-bottom:8px}
.tam-ref b{color:var(--orange)}
.tm{background:var(--bg-3);border-radius:8px;padding:10px 12px}
.tm .mn{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;color:var(--purple)}
.tm .ar{font-family:var(--mono);font-size:11.5px;color:var(--fg-mute);margin:4px 0}
.tm .rs{font-family:var(--mono);font-weight:700}
.tam-base{background:var(--purple-soft);border-radius:8px;padding:8px 12px;margin-top:8px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12.5px}
.tam-base .big{font-family:var(--mono);font-weight:700;font-size:16px}
.srclist{margin:0;padding-left:20px;font-size:12.5px;color:var(--fg-mute)}.srclist li{margin:2px 0}.srclist a{color:var(--purple);text-decoration:none;word-break:break-word}.srclist a:hover{text-decoration:underline}.srclist .sd{color:var(--fg-dim);font-family:var(--mono);font-size:11px;margin-left:4px}
.foot{border-left:2px solid var(--line-2);padding:4px 10px;color:var(--fg-mute);font-size:12.5px;margin-top:8px}
.cc{border-left:3px solid var(--yellow);background:var(--bg-3);border-radius:0 8px 8px 0;padding:10px 12px;font-size:12.5px}
.cc .ph{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;color:var(--yellow);margin-bottom:4px}
.risk{background:var(--bg-3);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:12.5px}
.risk .rt{display:flex;justify-content:space-between;margin-bottom:5px}
.rk-condition{background:var(--yellow-soft);color:var(--yellow)}.rk-actor-move{background:var(--orange-soft);color:var(--orange)}
.lk-high{background:var(--orange-soft);color:var(--orange)}.lk-med{background:var(--yellow-soft);color:var(--yellow)}.lk-low{background:var(--bg-2);color:var(--fg-dim)}
.risk .resp{background:var(--purple-soft);border-radius:6px;padding:6px 9px;margin-top:6px}
.asset{background:var(--bg-3);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.asset .an{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.st{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.st span{font-size:11px;font-family:var(--mono);padding:2px 7px;border-radius:5px;background:var(--green-soft);color:var(--green)}
.st span.no{background:var(--red-soft);color:var(--kill-text)}.st span.neu{background:var(--bg-2);color:var(--fg-mute)}
.aff{background:var(--bg-2);border-radius:6px;padding:7px 10px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:11.5px}
.aff .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--fg-dim)}
.hypo{color:var(--orange);font-style:italic}
.conf{color:var(--fg-mute);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.conf .on{color:var(--fg)}.conf .off{color:var(--fg-dim);text-decoration:line-through}
.htag{font-family:var(--mono);font-size:9.5px;background:var(--orange-soft);color:var(--orange);padding:1px 6px;border-radius:4px;margin-right:6px;letter-spacing:.5px}
/* decisions */
.dec{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.dec .db{background:var(--bg-3);border:1px solid var(--line-2);color:var(--fg-mute);padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;transition:all var(--t)}
.dec .db:hover{color:var(--fg);border-color:var(--fg-dim)}
.dec .db.on.approved{background:var(--green-soft);color:var(--green);border-color:var(--green)}
.dec .db.on.rejected{background:var(--red-soft);color:var(--kill-text);border-color:var(--kill-text)}
.dec .db.on.refine{background:var(--yellow-soft);color:var(--yellow);border-color:var(--yellow)}
.dec .db.star.on{background:var(--yellow-soft);color:var(--yellow);border-color:var(--yellow)}
.dec input{background:var(--bg);border:1px solid var(--line-2);color:var(--fg);border-radius:7px;padding:5px 9px;font-size:12px;font-family:inherit}
.dec input.owner{width:130px}.dec input.notes{flex:1;min-width:200px}
.dec .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--fg-dim);font-weight:700}
/* sketch grid */
.sk-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.sk-grid .card{margin-bottom:0}
.sk .head{grid-template-columns:auto 1fr auto;padding:14px 16px}
.sk .title{font-size:15px}
.skmeta{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px;margin-top:9px;color:var(--fg-mute)}
.skmeta .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--fg-dim);font-weight:700;padding-top:2px}
.skmeta .tamv{font-family:var(--mono);color:var(--fg)}
.sk .body{padding:4px 16px 16px 52px}
.subhead{display:flex;align-items:center;gap:10px;margin:22px 0 10px;color:var(--fg-mute);font-size:12px}
.subhead::after{content:"";flex:1;height:1px;background:var(--line)}
.subhead b{font-family:var(--mono);color:var(--fg);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:1px}
/* landscape */
.share{display:flex;align-items:center;gap:8px}
.share i{display:block;height:5px;background:var(--purple);border-radius:3px;opacity:.75}
.gap-saturated{color:var(--kill-text)}.gap-whitespace{color:var(--green)}.gap-forming{color:var(--yellow)}
.offthesis{font-size:9.5px;font-family:var(--mono);color:var(--fg-dim);border:1px solid var(--line-2);border-radius:4px;padding:0 4px;margin-left:6px}
footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);color:var(--fg-dim);font-size:12px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
/* empty, skeleton, toast */
.empty{text-align:center;padding:40px;color:var(--fg-mute);background:var(--bg-2);border:1px dashed var(--line-2);border-radius:12px}
.sk-line{background:linear-gradient(90deg,var(--bg-3) 0,#2f2b34 50%,var(--bg-3) 100%);background-size:200% 100%;animation:sh 1.1s linear infinite;border-radius:8px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.toast{position:fixed;right:22px;bottom:22px;background:var(--bg-3);border:1px solid var(--line-2);padding:10px 14px;border-radius:10px;font-size:12.5px;opacity:0;transform:translateY(6px);transition:opacity var(--t),transform var(--t);pointer-events:none;z-index:60}
.toast.show{opacity:1;transform:none}
.tip{position:fixed;z-index:70;background:#0f0e0f;border:1px solid var(--line-2);color:var(--fg);font-size:11.5px;padding:7px 9px;border-radius:7px;max-width:320px;pointer-events:none;opacity:0;transition:opacity 100ms}
#review{display:none}
@media (max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.sk-grid,.grid2,.grid3,.clocks{grid-template-columns:1fr}.rubric{grid-template-columns:repeat(3,1fr)}.body{padding-left:20px}.aff{grid-template-columns:1fr 1fr}}
/* PRINT: review export */
@media print{
 @page{margin:18mm}
 body{background:#fff;color:#151415;font-size:10.5pt}
 #app,.toast,.tip{display:none!important}
 #review{display:block;font-family:var(--sans);color:#151415}
 #review h1{font-size:22pt;letter-spacing:-.4px;margin:0}
 #review h2{font-size:13pt;border-bottom:2px solid #C8CCFF;padding-bottom:3px;margin:18pt 0 6pt}
 #review h3{font-size:11.5pt;margin:12pt 0 4pt}
 #review table{width:100%;border-collapse:collapse;font-size:9pt;page-break-inside:auto}
 #review th{background:#C8CCFF;color:#151415;text-transform:none;letter-spacing:0;font-size:9pt;padding:4pt 5pt;border:1px solid #b8bce8}
 #review td{border:1px solid #ddd;padding:4pt 5pt;vertical-align:top}
 #review .ex{border:1.5pt solid #FF5900;color:#FF5900;padding:4pt 8pt;font-weight:700;display:inline-block;margin:6pt 0}
 #review .flag{border-left:3pt solid #FF5900;padding-left:6pt}
 #review .full{page-break-before:always}
 #review .meta td:first-child{width:30%;color:#555}
 #review td.blank{height:22pt}
}
</style>
</head>

<script>
(function(){
"use strict";
const RUN = JSON.parse(document.getElementById('tof-run').textContent);
const LS_KEY='tof-run-'+RUN.run.date+'-v1';
const W={pain:20,market:20,timing:20,solution:15,rightToWin:15,impact:10};
const WQ={market:20,timing:20,rightToWin:15};
const CRIT_LABEL={pain:'Pain',market:'Market',timing:'Timing',solution:'Solution',rightToWin:'Right-to-win',impact:'Impact'};
const GATES=[['pain','Pain'],['market','Market'],['timing','Timing'],['margin','Margin'],['rightToWin','RTW'],['impact','Impact'],['killTest','Kill']];
const GLYPH={pass:'✓',conditional:'◐',fail:'✕',unknown:'?'};
const OUT_ORDER={advance:0,investigate:1,park:2,kill:3};
const STREAMS=[['extract','Extract'],['publications','Publications'],['jobs','Jobs'],['rfpsFilings','RFPs & filings']];
let S=load();
let UI={q:'',tier:'all',outcome:'all',arch:'all',sort:'tier',dir:-1};

function load(){try{return JSON.parse(localStorage.getItem(LS_KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}
function st(k){return (S[k]=S[k]||{})}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cad(n){if(n==null)return '—';if(n>=1e9)return 'C$'+(n/1e9).toFixed(1)+'B';if(n>=1e6)return 'C$'+Math.round(n/1e6)+'M';return 'C$'+n.toLocaleString('en-CA')}
function money(v,cur){if(v==null)return 'undisclosed';const sym={USD:'US$',CAD:'C$',GBP:'£',EUR:'€'}[cur]||(cur+' ');return v>=1e9?sym+(v/1e9).toFixed(1)+'B':sym+Math.round(v/1e6)+'M'}
function sc(c){return c.tier==='full'?Object.assign({},c.scores,(st('score')[c.id]||{})):Object.assign({},c.quickScores,(st('score')[c.id]||{}))}
function score(c){const s=sc(c),w=c.tier==='full'?W:WQ;let t=0,n=0;for(const k in w){t+=s[k]*w[k];n+=w[k]}return Math.round(t/n*100)/100}
function scls(v){return v>=3.5?'s-hi':v>=2.8?'s-mid':'s-lo'}
function tam(c){return c.tier==='full'&&c.tamBaseCad?c.tamBaseCad:(c.tamRough||{}).baseCad}
function timingScore(c){return sc(c).timing||0}
function isCanada(c){return !!(c.canadaGap&&c.canadaGap.canadaReason)}
function cards(){return RUN.cards.slice()}

function sorted(list){
 const k=UI.sort,d=UI.dir;
 return list.sort((a,b)=>{
  let r=0;
  if(k==='tier'){r=(a.tier==='full'?0:1)-(b.tier==='full'?0:1); if(!r) r=(['kill','park'].includes(a.outcome)?1:0)-(['kill','park'].includes(b.outcome)?1:0); if(!r) r=score(b)-score(a); if(!r) r=timingScore(b)-timingScore(a); return r}
  if(k==='score'){r=score(a)-score(b); if(!r) r=timingScore(a)-timingScore(b)}
  else if(k==='name') r=a.name.localeCompare(b.name);
  else if(k==='outcome') r=OUT_ORDER[a.outcome]-OUT_ORDER[b.outcome];
  else if(k==='tam') r=(tam(a)||0)-(tam(b)||0);
  return r*d;
 });
}
function filtered(){
 const q=UI.q.trim().toLowerCase();
 return cards().filter(c=>{
  if(UI.tier!=='all'&&c.tier!==UI.tier)return false;
  if(UI.outcome!=='all'&&c.outcome!==UI.outcome)return false;
  if(UI.arch!=='all'&&c.archetype!==UI.arch)return false;
  if(q){const hay=[c.name,c.oneLiner,c.signal,c.painPoint,(c.inspiredBy||[]).map(i=>i.name).join(' ')].join(' ').toLowerCase(); if(!hay.includes(q))return false}
  return true;
 });
}

/* ---------- pieces ---------- */
const outChip=o=>`<span class="chip o-${o}">${o==='advance'?'Advance':o==='investigate'?'Investigate':o==='park'?'Park':'Kill'}</span>`;
const tierChip=t=>`<span class="chip t-${t}">${t}</span>`;
function inspired(c){
 const l=c.inspiredBy||[]; if(!l.length) return `<div class="insp"><span class="lbl">Inspired by</span><span class="chip o-kill">provenance missing</span></div>`;
 return `<div class="insp"><span class="lbl">Inspired by</span>${l.slice(0,4).map(i=>`<span class="co" data-tip="${esc(i.name)} — ${esc(money(i.raise,i.currency))} ${esc(i.round)}, ${esc(i.date)}, ${esc(i.geography)}${i.note?' · '+esc(i.note):''}">${esc(i.name.replace(' (fictional)',''))}<span class="m">${esc(money(i.raise,i.currency))} · ${esc(i.round)} · ${esc(i.date)} · ${esc(i.geography)}</span></span>`).join('')}${l.length>4?`<span class="co">+${l.length-4}</span>`:''}</div>`;
}
function gateStrip(c){
 return `<div class="gates">${GATES.map(([k,l])=>{const g=(c.gates||{})[k]||{result:'unknown',note:'Not assessed'};const r=GLYPH[g.result]?g.result:'unknown';return `<span class="gp g-${r}" data-tip="${esc(l)}: ${esc(r)} — ${esc(g.note)}">${l} ${GLYPH[r]}</span>`}).join('')}</div>`;
}
function chips(c){
 return [tierChip(c.tier),outChip(c.outcome),`<span class="chip c-pattern">↗ ${esc(c.breakInPattern)}</span>`,`<span class="chip c-arch">${esc(c.archetype)}</span>`,
 isCanada(c)?`<span class="chip c-ca">🇨🇦 Canada</span>`:'',
 c.previouslyExplored?`<span class="chip c-pe" data-tip="${esc(c.previouslyExplored.note)}">◈ #${c.previouslyExplored.number}</span>`:'',
 st('promote')[c.id]?`<span class="chip c-star">★ promoted</span>`:''].join('');
}
function head(c){
 const v=score(c);
 return `<div class="head" tabindex="0" role="button" aria-expanded="${!!st('open')[c.id]}" data-toggle="${c.id}">
  <div class="rank">#${c.rank}</div>
  <div><div class="title"><span class="nm">${esc(c.name)}</span>${chips(c)}</div>
   <div class="oneliner">${esc(c.oneLiner)}</div>${inspired(c)}${gateStrip(c)}
   ${c.tier==='sketch'?skMeta(c):''}</div>
  <div class="hd-r"><div class="score ${scls(v)}">${v.toFixed(2)}</div><div class="basis">${c.tier==='full'?'6-crit':'quick · 3'}</div><div class="caret">▶</div></div></div>`;
}
function skMeta(c){
 const g=c.canadaGap||{};
 return `<div class="skmeta"><span class="k">Base TAM</span><span><span class="tamv" data-tip="${esc((c.tamRough||{}).arithmetic)}">${tam(c)?'~'+cad(tam(c)):'not sized'}</span> <span style="color:var(--fg-dim)">· ${esc((c.tamRough||{}).arithmetic)}</span></span>
 <span class="k">Canada gap</span><span><span class="gap-${g.read}">${esc(g.read)}</span> — ${g.canadaReason?esc(g.canadaReason):'<span class="hypo">no Canada-specific reason named</span>'}</span>
 <span class="k">Timing</span><span>${esc(c.timingHook)}</span></div>`;
}
function rubric(c){
 const s=sc(c),base=c.tier==='full'?c.scores:c.quickScores,w=c.tier==='full'?W:WQ,ov=st('score')[c.id]||{},meta=st('scoreMeta')[c.id]||{};
 return `<div class="rubric ${c.tier==='sketch'?'q':''}">${Object.keys(w).map(k=>{const prov=(c.provisionalScores||[]).includes(k)&&ov[k]==null;
  return `<div class="rc ${prov?'prov':''}"><div class="l">${CRIT_LABEL[k]}<span>${w[k]}</span></div>
  <span class="v" data-edit="${c.id}|${k}" tabindex="0" title="Click to override">${s[k]}</span>${prov?' <span class="tag">prov.</span>':''}
  <div class="bar"><i style="width:${s[k]*20}%"></i></div>
  ${ov[k]!=null?`<div class="ed">edited${meta[k]?' '+esc(ago(meta[k])):''} · was ${base[k]}<a data-reset="${c.id}|${k}">reset</a></div>`:''}</div>`}).join('')}</div>`;
}
function ago(t){const m=Math.round((Date.now()-t)/60000);return m<1?'just now':m+'m ago'}
function decision(c){
 const d=st('decision')[c.id]||{};
 const b=(v,l)=>`<button class="db ${d.status===v?'on '+v:''}" data-dec="${c.id}|${v}">${l}</button>`;
 return `<div class="dec"><span class="lbl">Reviewer</span>${b('approved','Approve')}${b('rejected','Reject')}${b('refine','Refine')}
 ${c.tier==='sketch'?`<button class="db star ${st('promote')[c.id]?'on':''}" data-promote="${c.id}">★ Promote to Tier 2</button>`:''}
 <input class="owner" placeholder="Owner" value="${esc(d.owner||'')}" data-owner="${c.id}">
 <input class="notes" placeholder="${d.status==='refine'?'What should be refined?':'Notes'}" value="${esc(d.notes||'')}" data-notes="${c.id}"></div>`;
}
function conf(c){
 const used=c.streams||['extract'];
 return `<div class="conf"><span>Confidence <b class="mono" style="color:var(--fg)">${esc(c.confidence)}</b></span>${STREAMS.map(([k,l])=>`<span class="${used.includes(k)?'on':'off'}">${l}</span>`).join('')}</div>`;
}
function fullBody(c){
 const tc=c.threeClocks,cp=c.competitors;
 const clk=(cls,l,glyph,body,date,extra='')=>`<div class="clock ${cls}"><div class="l">${l} ${glyph}</div><div>${esc(body)}</div>${extra}<div class="d">${date}</div></div>`;
 return `<div class="body">
 <div class="signal">📡 ${esc(c.signal)}</div>
 ${c.previouslyExplored?`<div class="blk callout or"><b class="t">◈ Previously explored — newco #${c.previouslyExplored.number} ${esc(c.previouslyExplored.name)}</b>${esc(c.previouslyExplored.note)}</div>`:''}
 ${c.previouslyExploredNote?`<div class="foot">${esc(c.previouslyExploredNote)}</div>`:''}
 <div class="blk"><div class="blk-h">Rubric <span class="hint">weights sum to 100 · click a score to override</span></div>${rubric(c)}</div>
 <div class="blk"><div class="blk-h">Three clocks <span class="hint">verdict: ${esc(tc.verdict)}</span></div><div class="clocks">
  ${clk(tc.enabling.rung?'rung':'','Enabling',tc.enabling.rung?'✓':'○',tc.enabling.evidence,'Rang: '+esc(tc.enabling.date))}
  ${clk(tc.budget.rung?'rung':'','Budget',tc.budget.rung?'✓':'○',tc.budget.evidence,'First purchase: '+esc(tc.budget.firstPurchaseDate),
     tc.budget.streamEvidence.length?`<div class="srcs">${tc.budget.streamEvidence.map(s=>`<span>${esc(s)}</span>`).join('')}</div>`:'<div class="srcs"><span>no stream evidence yet</span></div>')}
  ${clk(tc.competitive.status==='closing'?'closing':'','Competitive',tc.competitive.status==='closing'?'⚠':'○',tc.competitive.closingEvent+' ('+tc.competitive.status+')','Closing by: '+esc(tc.competitive.closingBy))}
 </div><div class="callout pu" style="margin-top:8px"><b class="t">Dated prediction</b>${esc(tc.datedPrediction)}</div></div>
 <div class="blk grid2"><div><div class="blk-h">Pain</div><div><span class="htag">HYPOTHESIS</span>${esc(c.painPoint.replace(/^HYPOTHESIS\.\s*/,''))}</div><div class="foot">Buyer: ${esc(c.buyer.role)} — ${esc(c.buyer.segment)}</div></div>
  <div><div class="blk-h">Solution</div><div>${esc(c.solution)}</div></div></div>
 <div class="blk"><div class="blk-h">Margin layers <span class="hint">${esc(c.archetype)} band</span></div>
  <div class="ml-bar">${c.marginLayers.map(m=>`<i style="flex:${m.weightPct}" data-tip="${esc(m.layer)} ${m.weightPct}%"></i>`).join('')}</div>
  <div class="pills">${c.marginLayers.map(m=>`<div class="pill" data-tip="${esc(m.note)}"><span class="pl">${esc(m.layer)}</span><span class="pw">${m.weightPct}%</span></div>`).join('')}</div></div>
 <div class="blk"><div class="blk-h">Market size</div>
  <div class="tam-ref"><b>Reference cost base ≠ TAM.</b> ${esc(c.referenceCostBase)}</div>
  <div class="grid2">${c.tamMethodology.map(m=>`<div class="tm"><div class="mn">${esc(m.method)}</div><div class="ar">${esc(m.arithmetic)}</div><div class="rs">${cad(m.resultCad)}</div></div>`).join('')}</div>
  <div class="tam-base"><span>Base TAM — lower of methods within 2× · <span style="color:var(--fg-mute)">${esc(c.tamGeography)}</span></span><span class="big">${cad(c.tamBaseCad)}</span></div>
  <div class="foot">Buyer-level sanity: ${esc(c.buyerLevelSanity)}</div></div>
 <div class="blk"><div class="blk-h">Competitors</div><div class="grid3">
  <div class="panel"><div class="ph">Direct</div>${cp.direct.map(x=>`<div class="it"><b>${esc(x.name)}</b><span class="thr thr-${x.threat}">${x.threat}</span><div class="meta">${esc(x.founded)} · ${esc(x.funding)} · ${esc(x.geography)}</div></div>`).join('')||'<div class="it meta">None found</div>'}</div>
  <div class="panel"><div class="ph">Substitutes</div>${cp.substitutes.map(x=>`<div class="it"><b>${esc(x.name)}</b><div style="color:var(--fg-mute)">${esc(x.note)}</div></div>`).join('')}</div>
  <div class="panel"><div class="ph">Adjacent extenders</div>${cp.adjacentExtenders.map(x=>`<div class="it"><b>${esc(x.name)}</b><div style="color:var(--fg-mute)">Not direct because: ${esc(x.structuralReasonNotDirect)}</div></div>`).join('')}</div>
 </div><div class="callout or dash" style="margin-top:8px"><b class="t">Status quo — the real incumbent</b>${esc(c.statusQuo)}</div></div>
 <div class="blk"><div class="blk-h">Counter-case</div><div class="grid2"><div class="cc"><div class="ph">Graveyard</div>${esc(c.graveyard)}</div><div class="cc"><div class="ph">Three-year counterfactual</div>${esc(c.threeYearCounterfactual)}</div></div></div>
 <div class="blk"><div class="blk-h">Key risks &amp; questions <span class="hint">${c.keyRisks.length} of 3–5</span></div>
  ${c.keyRisks.slice(0,5).map(r=>{const lk=(r.likelihood||'').split(/[ —]/)[0];return `<div class="risk"><div class="rt"><span class="chip rk-${r.type}">${r.type}</span><span class="chip lk-${lk}">${esc(lk)}</span></div>
  <b>${esc(r.subject)}.</b> ${esc(r.mechanism)} <span style="color:var(--fg-dim)">${esc(r.likelihood)}</span><div class="resp"><b>If it happens:</b> ${esc(r.response)}</div></div>`}).join('')}
  ${c.keyRisks.length>5?'<div class="callout re">Spec cap is 3–5 — ranking work not done.</div>':''}</div>
 <div class="blk"><div class="blk-h">Climate impact</div><div>${esc(c.climateImpact)}</div></div>
 <div class="blk"><div class="blk-h">Unfair advantage — ${c.unfairAdvantage.length} candidate asset${c.unfairAdvantage.length===1?'':'s'}</div>
  ${c.unfairAdvantage.map(a=>{const t=a.stressTest,f=a.affinityCheck;return `<div class="asset"><div class="an">${esc(a.assetName)}<span class="chip c-pattern">${esc(a.category)}</span></div>
  <div class="st"><span class="${t.specific?'':'no'}">Specific ${t.specific?'✓':'✕'}</span><span class="neu">Head-start ${esc(t.headStart)}</span><span class="${t.exclusive?'':'no'}">Exclusive ${t.exclusive?'✓':'✕'}</span><span class="${t.relevant?'':'no'}">Relevant ${t.relevant?'✓':'✕'}</span></div>
  <div class="aff"><div><div class="k">Relationship</div>${esc(f.primaryRelationship)}</div><div><div class="k">Owner</div>${esc(f.internalOwner)}</div><div><div class="k">Last contact</div>${esc(f.lastContactDate)}</div><div><div class="k">Logged</div>${/HYPOTHETICAL/.test(f.loggedConversationsOnTheme)?`<span class="hypo">${esc(f.loggedConversationsOnTheme)}</span>`:esc(f.loggedConversationsOnTheme)}</div></div></div>`}).join('')}
  ${c.honestGaps?`<div class="callout ye"><b class="t">Honest gaps</b>${esc(c.honestGaps)}</div>`:'<div class="callout re"><b class="t">⚠ Honest gaps missing</b>Right-to-win section is cheerleading. Reject the card until populated.</div>'}</div>
 ${c.marginFlag?`<div class="blk callout or"><b class="t">⚠ Margin flag — ${esc(c.archetype)} band</b>${esc(c.marginFlag)}</div>`:''}
 ${c.outcome==='park'&&c.reentryTrigger?`<div class="blk callout pu"><b class="t">Park re-entry trigger</b>${esc(c.reentryTrigger)}</div>`:''}
 ${c.outcome==='kill'&&c.disqualifier?`<div class="blk callout re"><b class="t">Disqualifier</b>${esc(c.disqualifier)}</div>`:''}
 <div class="blk callout re"><b class="t">Kill risk</b>${esc(c.killRisk)}</div>
 ${sourcesBlk(c)}
 <div class="blk">${conf(c)}</div>
 ${decision(c)}</div>`;
}
function sourcesBlk(c){const l=c.sources||[];if(!l.length)return c.tier==='full'?'<div class="blk callout re"><b class="t">⚠ Sources missing</b>Full cards must cite sources.</div>':'';
 return `<div class="blk"><div class="blk-h">Sources <span class="hint">${l.length} cited · dated</span></div><ol class="srclist">${l.map(x=>`<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a> <span class="sd">${esc(x.date)}</span></li>`).join('')}</ol></div>`}
function sketchBody(c){
 return `<div class="body">
 <div class="blk"><div class="blk-h">Quick scores <span class="hint">market 20 · timing 20 · right-to-win 15</span></div>${rubric(c)}</div>
 <div class="blk"><div class="blk-h">Buyer</div>${esc(c.buyer.role)} — ${esc(c.buyer.segment)}</div>
 ${c.outcome==='kill'?`<div class="blk callout re"><b class="t">Disqualifier</b>${esc(c.disqualifier)}</div>`:''}
 ${c.outcome==='park'?`<div class="blk callout pu"><b class="t">Park re-entry trigger</b>${esc(c.reentryTrigger)}</div>`:''}
 ${c.openQuestion&&c.openQuestion!=='—'?`<div class="blk callout ye"><b class="t">Open question</b>${esc(c.openQuestion)}</div>`:''}
 ${c.previouslyExplored?`<div class="blk callout or"><b class="t">◈ Previously explored — newco #${c.previouslyExplored.number} ${esc(c.previouslyExplored.name)}</b>${esc(c.previouslyExplored.note)}</div>`:''}
 ${c.notes?`<div class="blk foot">${esc(c.notes)}</div>`:''}${sourcesBlk(c)}
 <div class="blk">${conf(c)}</div>${decision(c)}</div>`;
}
function card(c){
 return `<article class="card ${c.outcome} ${c.tier==='sketch'?'sk':''} ${st('open')[c.id]?'open':''}" id="card-${c.id}">${head(c)}<div class="body-wrap"><div class="body-inner">${c.tier==='full'?fullBody(c):sketchBody(c)}</div></div></article>`;
}

 const r=RUN.run,all=cards();

 const fs=l=>`${l.filter(c=>c.tier==='full').length} full · ${l.filter(c=>c.tier==='sketch').length} sketch`;
 const list=sorted(filtered());
 const th=(k,l,cls='')=>`<th class="sortable ${cls} ${UI.sort===k?'on':''}" data-sort="${k}">${l}${UI.sort===k&&k!=='tier'?(UI.dir<0?' ↓':' ↑'):''}</th>`;
 const archs=[...new Set(all.map(c=>c.archetype))];
 const active=(UI.q?1:0)+(UI.tier!=='all')+(UI.outcome!=='all')+(UI.arch!=='all');

 document.getElementById('root').innerHTML=`

   <div class="stat"><div class="k">Companies</div><div class="v">${r.extract.companyCount}</div><div class="f">${RUN.landscape.length} clusters</div></div>
   <div class="stat"><div class="k">Canadian</div><div class="v">${r.extract.canadianCount}</div><div class="f">${Math.round(r.extract.canadianCount/r.extract.companyCount*100)}% of input</div></div>
   <div class="stat" style="--acc:var(--green)"><div class="k">Advance</div><div class="v">${cnt('advance').length}</div><div class="f">${fs(cnt('advance'))}</div></div>
   <div class="stat" style="--acc:var(--yellow)"><div class="k">Investigate</div><div class="v">${cnt('investigate').length}</div><div class="f">${fs(cnt('investigate'))}</div></div>
   <div class="stat" style="--acc:var(--purple)"><div class="k">Park</div><div class="v">${cnt('park').length}</div><div class="f">${fs(cnt('park'))}</div></div>
   <div class="stat" style="--acc:var(--red)"><div class="k">Kill</div><div class="v">${cnt('kill').length}</div><div class="f">${fs(cnt('kill'))}</div></div>
  </div>
  <div class="sec" style="margin-top:22px"><div class="sec-h"><span class="label">Rankings</span><span class="sec-note">Full cards first, then sketches · tie-break: Timing</span></div>
  <div class="tbl-wrap"><table><thead><tr>${th('tier','#')}${th('name','Idea')}<th>Tier</th>${th('outcome','Outcome')}<th>Category</th>${th('tam','Base TAM (CAD)','num')}${th('score','Score','num')}<th>Rubric</th><th>Flags</th><th></th></tr></thead><tbody>
  ${sorted(cards()).map(c=>{const s=sc(c),w=c.tier==='full'?W:WQ,mx=Math.max(...Object.keys(w).map(k=>s[k])),v=score(c);
   const fl=[isCanada(c)?'🇨🇦':'',c.previouslyExplored?`<span class="pe">◈#${c.previouslyExplored.number}</span>`:'',c.marginFlag?'⚠':'',(c.keyRisks||[]).some(k=>/^high/.test(k.likelihood))?'🔺':'',st('promote')[c.id]?'★':''].join('');

  <div class="tbl-wrap"><table><thead><tr><th>Cluster</th><th>Input share</th><th>Canada gap</th><th>Canadian players</th><th>Note</th><th>Cards</th></tr></thead><tbody>
  ${RUN.landscape.map(l=>`<tr><td><b>${esc(l.cluster)}</b>${l.onThesis?'':'<span class="offthesis">OFF-THESIS</span>'}</td>
  <td><div class="share"><i style="width:${l.inputSharePct*2}px"></i><span class="mono">${l.inputSharePct}%</span></div></td>
  <td class="gap-${l.read}" style="font-weight:600">${esc(l.read)}</td><td style="color:var(--fg-mute)">${l.canadianPlayers.length?esc(l.canadianPlayers.join(', ')):'none'}</td>

 <footer><div>Run file <span class="mono">tof-ideas-${esc(r.date)}.json</span> · ${esc(r.promotionNote)}</div><div>Decisions are stored in this browser only. Live run on real extracts · ${esc((r.previouslyExploredCheck||{}).ran?'Drive cross-check run':'Drive cross-check not run — Drive access')}.</div></footer>`;
 bind();
}

/* ---------- events ---------- */
function toggle(id){const o=st('open');o[id]=!o[id];save();const el=document.getElementById('card-'+id);if(el){el.classList.toggle('open',!!o[id]);el.querySelector('.head').setAttribute('aria-expanded',!!o[id])}}
function bind(){
 const $=s=>document.querySelector(s);
 document.querySelectorAll('[data-toggle]').forEach(h=>{h.onclick=e=>{if(e.target.closest('[data-tip].co,.gp'))return;toggle(h.dataset.toggle)};h.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(h.dataset.toggle)}}});
 document.querySelectorAll('[data-jump]').forEach(r=>r.onclick=e=>{e.preventDefault();const id=r.dataset.jump;UI.q='';UI.tier='all';UI.outcome='all';UI.arch='all';st('open')[id]=true;save();render();const el=document.getElementById('card-'+id);el.scrollIntoView({behavior:'smooth',block:'start'})});
 document.querySelectorAll('th[data-sort]').forEach(t=>t.onclick=()=>{const k=t.dataset.sort;if(UI.sort===k)UI.dir*=-1;else{UI.sort=k;UI.dir=k==='name'||k==='outcome'?1:-1}render()});
 const q=$('#q');if(q)q.oninput=e=>{UI.q=e.target.value;const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
 document.querySelectorAll('[data-tier]').forEach(b=>b.onclick=()=>{UI.tier=b.dataset.tier;render()});
 $('#fo').onchange=e=>{UI.outcome=e.target.value;render()};$('#fa').onchange=e=>{UI.arch=e.target.value;render()};
 $('#so').onchange=e=>{UI.sort=e.target.value;UI.dir=e.target.value==='name'?1:-1;render()};
 ['#clr','#clr2'].forEach(s=>{const b=$(s);if(b)b.onclick=()=>{UI.q='';UI.tier='all';UI.outcome='all';UI.arch='all';render()}});
 document.querySelectorAll('[data-edit]').forEach(v=>{const go=()=>editScore(v);v.onclick=e=>{e.stopPropagation();go()};v.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}}});
 document.querySelectorAll('[data-reset]').forEach(a=>a.onclick=()=>{const[id,k]=a.dataset.reset.split('|');delete st('score')[id][k];save();render();toast('Score reset')});
 document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{const[id,v]=b.dataset.dec.split('|');const d=st('decision')[id]=st('decision')[id]||{};d.status=d.status===v?null:v;d.at=Date.now();save();render();toast(d.status?'Decision saved: '+d.status:'Decision cleared');if(d.status==='refine'){const n=document.querySelector(`[data-notes="${id}"]`);n&&n.focus()}});
 document.querySelectorAll('[data-promote]').forEach(b=>b.onclick=()=>{const id=b.dataset.promote,p=st('promote');p[id]=!p[id];save();render();toast(p[id]?'Flagged for Tier 2 in the next run':'Promotion removed')});
 document.querySelectorAll('[data-owner],[data-notes]').forEach(i=>i.onchange=()=>{const id=i.dataset.owner||i.dataset.notes;const d=st('decision')[id]=st('decision')[id]||{};d[i.dataset.owner?'owner':'notes']=i.value;save();toast('Saved')});
 $('#copyDec').onclick=copyDecisions;$('#exportDoc').onclick=()=>exportReview(false);
 tips();
}
function editScore(el){
 const[id,k]=el.dataset.edit.split('|');const cur=el.textContent;
 el.outerHTML=`<input type="number" min="1" max="5" step="1" value="${cur}" id="ed-${id}-${k}">`;
 const i=document.getElementById(`ed-${id}-${k}`);i.focus();i.select();
 const commit=()=>{const v=Math.max(1,Math.min(5,parseInt(i.value,10)));if(!isNaN(v)){const c=RUN.cards.find(x=>x.id===id),base=(c.tier==='full'?c.scores:c.quickScores)[k];
  if(v===base){if(st('score')[id])delete st('score')[id][k]}else{(st('score')[id]=st('score')[id]||{})[k]=v;(st('scoreMeta')[id]=st('scoreMeta')[id]||{})[k]=Date.now()}save();toast(`${CRIT_LABEL[k]} → ${v}; score recomputed`)}render()};
 i.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')commit();if(e.key==='Escape')render()};i.onblur=commit;i.onclick=e=>e.stopPropagation();
}
function copyDecisions(){
 const t=sorted(cards()).map(c=>{const d=st('decision')[c.id]||{};return `#${c.rank} ${c.name} [${c.tier}, ${c.outcome}] — ${d.status||'no decision'}${d.owner?' · owner '+d.owner:''}${d.notes?' · '+d.notes:''}${st('promote')[c.id]?' · ★ promote':''}`}).join('\n');
 const done=()=>toast('Decision summary copied');
 try{navigator.clipboard.writeText('TOF decisions — run '+RUN.run.date+'\n'+t).then(done,()=>toast('Copy blocked by browser'))}catch(e){toast('Copy blocked by browser')}
}
let tt;function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2500)}
function tips(){const tip=document.getElementById('tip');document.querySelectorAll('[data-tip]').forEach(el=>{el.onmouseenter=()=>{tip.textContent=el.dataset.tip;const r=el.getBoundingClientRect();tip.style.left=Math.min(r.left,innerWidth-330)+'px';tip.style.top=(r.bottom+6)+'px';tip.style.opacity=1};el.onmouseleave=()=>tip.style.opacity=0})}

/* ---------- review export (print) ---------- */
function exportReview(silent){
 const r=RUN.run,all=sorted(cards().slice()).sort((a,b)=>a.rank-b.rank);
 const G=c=>GATES.map(([k,l])=>`${l}: ${((c.gates||{})[k]||{}).result||'unknown'}`).join(' · ');
 const full=all.filter(c=>c.tier==='full'),sk=all.filter(c=>c.tier==='sketch'&&!['kill','park'].includes(c.outcome)),kp=all.filter(c=>['kill','park'].includes(c.outcome));
 const ins=c=>(c.inspiredBy||[]).map(i=>`${i.name} (${money(i.raise,i.currency)}, ${i.date}, ${i.geography})`).join('; ');
 document.getElementById('review').innerHTML=`
 ${RUN.exampleData?'<div class="ex">EXAMPLE DATA — NOT A REAL RUN</div>':''}<h1>TOF Review — ${esc(r.date)}</h1>
 <table class="meta"><tbody><tr><td>Extract</td><td>${esc(r.extract.source)} · ${esc(r.extract.file)} (pulled ${esc(r.extract.pulledAt)})</td></tr><tr><td>Companies / Canadian</td><td>${r.extract.companyCount} / ${r.extract.canadianCount}</td></tr><tr><td>Streams</td><td>${r.streamsUsed.length}/4</td></tr><tr><td>FX</td><td>${r.fxUsdCad} USD→CAD</td></tr><tr><td>Doctrine</td><td>v${RUN.schemaVersion}</td></tr><tr><td>Analyst</td><td>${esc(r.analyst)}</td></tr></tbody></table>
 <h2>TL;DR</h2><ul>${r.tldr.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
 <h2>Ranked ideas</h2><table><thead><tr><th>#</th><th>Idea</th><th>Outcome</th><th>Score (tier)</th><th>Base TAM (CAD)</th><th>Inspired by</th><th>Archetype</th></tr></thead><tbody>
 ${all.map(c=>`<tr><td>${c.rank}</td><td><b>${esc(c.name)}</b><br>${esc(c.oneLiner)}</td><td>${c.outcome.toUpperCase()}</td><td>${score(c).toFixed(2)} (${c.tier})</td><td>${c.tier==='sketch'?'~':''}${cad(tam(c))}</td><td>${esc((c.inspiredBy||[]).map(i=>i.name.replace(' (fictional)','')).join(', '))}</td><td>${esc(c.archetype)}</td></tr>`).join('')}</tbody></table>
 <h2>Landscape → Canada gap</h2><table><thead><tr><th>Cluster</th><th>Share</th><th>Read</th><th>Canadian players</th><th>Note</th></tr></thead><tbody>${RUN.landscape.map(l=>`<tr><td>${esc(l.cluster)}</td><td>${l.inputSharePct}%</td><td>${esc(l.read)}</td><td>${esc(l.canadianPlayers.join(', ')||'none')}</td><td>${esc(l.note)}</td></tr>`).join('')}</tbody></table>
 ${full.map(c=>`<div class="full"><h2>${c.rank}. ${esc(c.name)} — ${c.outcome.toUpperCase()} · ${score(c).toFixed(2)}</h2>
  <p><b>The idea.</b> ${esc(c.oneLiner)} Buyer: ${esc(c.buyer.role)}, ${esc(c.buyer.segment)}.</p><p><b>Inspired by.</b> ${esc(ins(c))}</p>
  <h3>Why now</h3><p>${esc(c.threeClocks.datedPrediction)} Enabling: ${esc(c.threeClocks.enabling.evidence)} Budget: ${esc(c.threeClocks.budget.evidence)}</p>
  <h3>Market</h3><p>Base TAM ${cad(c.tamBaseCad)} (${esc(c.tamGeography)}). ${c.tamMethodology.map(m=>esc(m.method)+': '+esc(m.arithmetic)).join(' Cross-check — ')}. ${esc(c.buyerLevelSanity)} <i>${esc(c.referenceCostBase)}</i></p>
  <h3>Competition and status quo</h3><p>Status quo: ${esc(c.statusQuo)} Direct: ${esc(c.competitors.direct.map(x=>x.name+' ('+x.threat+')').join(', ')||'none')}. Adjacent: ${esc(c.competitors.adjacentExtenders.map(x=>x.name+' — '+x.structuralReasonNotDirect).join('; '))}</p>
  <h3>Counter-case</h3><p>${esc(c.graveyard)} ${esc(c.threeYearCounterfactual)}</p>
  <h3>Margin path</h3><p>${esc(c.marginLayers.map(m=>m.layer+' '+m.weightPct+'%').join(', '))}.</p>${c.marginFlag?`<p class="flag"><b>Margin flag.</b> ${esc(c.marginFlag)}</p>`:''}
  <h3>Right-to-win and honest gaps</h3><p>${esc(c.unfairAdvantage.map(a=>a.assetName+' ('+a.category+', head-start '+a.stressTest.headStart+'; '+a.affinityCheck.loggedConversationsOnTheme+')').join('; '))}. <b>Honest gaps:</b> ${esc(c.honestGaps)}</p>
  <h3>Key risks</h3><ul>${c.keyRisks.map(k=>`<li><b>${esc(k.subject)}.</b> ${esc(k.mechanism)} Likelihood: ${esc(k.likelihood)}. Response: ${esc(k.response)}</li>`).join('')}</ul>
  <p><b>Gates.</b> ${esc(G(c))}</p><p><b>Open questions.</b> ${esc((c.openQuestions||[]).join(' · '))}</p></div>`).join('')}
 <h2>Other ideas (sketch cards)</h2>${sk.map(c=>`<p><b>${c.rank}. ${esc(c.name)}</b> — ${c.outcome.toUpperCase()} · ${score(c).toFixed(2)}q · ~${cad(tam(c))}<br>${esc(c.oneLiner)}<br>Inspired by ${esc(ins(c))}. Canada gap: ${esc(c.canadaGap.read)} — ${esc(c.canadaGap.canadaReason||'none named')}. Open question: ${esc(c.openQuestion)}</p>`).join('')}
 <h2>Appendix — KILL and PARK</h2><table><thead><tr><th>Idea</th><th>Outcome</th><th>Disqualifier / re-entry trigger</th></tr></thead><tbody>${kp.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.outcome.toUpperCase()}</td><td>${esc(c.disqualifier||c.reentryTrigger)}</td></tr>`).join('')}</tbody></table>
 <h2>Reviewer decisions</h2><table><thead><tr><th>Idea</th><th>Approve</th><th>Reject</th><th>Refine</th><th>Owner</th><th>Notes</th></tr></thead><tbody>${all.map(c=>`<tr><td>${esc(c.name)}</td><td class="blank"></td><td class="blank"></td><td class="blank"></td><td class="blank"></td><td class="blank" style="width:35%"></td></tr>`).join('')}</tbody></table>
 <h2>Open questions</h2><ul>${all.flatMap(c=>(c.openQuestions||[c.openQuestion]).filter(q=>q&&q!=='—').map(q=>`<li>${esc(q)} <i>(${esc(c.name)})</i></li>`)).join('')}</ul>`;
 if(silent)return;
 toast('Opening print view — choose “Save as PDF”.');
 setTimeout(()=>window.print(),300);
}

/* ---------- boot with skeleton ---------- */
document.getElementById('root').innerHTML=`<div class="sk-line" style="height:30px;width:280px"></div><div class="sk-line" style="height:16px;width:460px;margin-top:12px"></div>
<div class="stats">${'<div class="sk-line" style="height:76px"></div>'.repeat(6)}</div>${'<div class="sk-line" style="height:42px;margin-top:10px"></div>'.repeat(6)}`;
if(!Object.keys(st('open')).length){const top=RUN.cards.find(c=>c.tier==='full');if(top){st('open')[top.id]=true}}
setTimeout(()=>{const m=location.hash.match(/^#open=(.+)$/);if(m){st('open')[m[1]]=true}render();if(location.hash==='#review')exportReview(true);if(m){const el=document.getElementById('card-'+m[1]);if(el)el.scrollIntoView({block:'start'})}},280);
})();
</script>
